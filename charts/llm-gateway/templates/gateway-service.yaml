{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm-gateway.fullname" . }}
  labels:
    name: {{ include "llm-gateway.fullname" . }}
    app: {{ include "llm-gateway.fullname" . }}
    {{- with .Values.gateway.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  selector:
    app: {{ include "llm-gateway.fullname" . }}
    {{- include "llm-gateway.selectorLabels" . | nindent 4 }}
{{- end }}
