{{- if .Values.router.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcpx-hive.name" . }}-router
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "mcpx-hive.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: router
    app.kubernetes.io/part-of: {{ include "mcpx-hive.name" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.router.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mcpx-hive.name" . }}
      app.kubernetes.io/component: router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "mcpx-hive.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: router
        app.kubernetes.io/part-of: {{ include "mcpx-hive.name" . }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
    spec:
      containers:
        - name: router
          image: "{{ .Values.router.image.repository }}:{{ .Values.router.image.tag }}"
          ports:
            - containerPort: 9000
              name: mcpx-server
            - containerPort: 5173
              name: ui
            - containerPort: 3000
              name: metrics
          env:
            - name: OIDC_ISSUER_URL
              value: "{{ .Values.global.oidc.issuerUrl }}"
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcpx-hive.fullname" . }}-secret
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcpx-hive.fullname" . }}-secret
                  key: OIDC_CLIENT_SECRET
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcpx-hive.fullname" . }}-secret
                  key: SESSION_SECRET
            - name: REDIS_IS_CLUSTER
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcpx-hive.fullname" . }}-secret
                  key: REDIS_IS_CLUSTER
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcpx-hive.fullname" . }}-secret
                  key: REDIS_URL
            - name: UI_DOMAIN
              value: "{{ .Values.ui_domain }}"
            - name: ROUTER_DOMAIN
              value: "{{ .Values.router_domain }}"
            - name: HIVE_DOMAIN
              value: "{{ .Values.domain }}"
            - name: RELEASE_NAMESPACE
              value: "{{ .Release.Namespace }}"
          livenessProbe:
            httpGet:
              path: /health
              port: 5173
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 5173
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.router.resources | nindent 12 }}
      volumes:
        - name: nginx-logs-volume
          emptyDir: {}
      {{- with .Values.router.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 10 }}
      {{- end }}
{{- end }}
