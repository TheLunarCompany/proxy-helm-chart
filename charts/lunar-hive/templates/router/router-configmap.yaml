apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcpx-hive.name" . }}-router
  namespace: {{ .Release.Namespace }}
data:
  init.sh: |
    #!/bin/sh
    set -e
    apk add --no-cache ca-certificates
    luarocks install lua-resty-openidc
    luarocks install lua-resty-session 3.10
    luarocks install lua-resty-string
    echo "--- Running NGINX configuration test ---"
    /usr/local/openresty/bin/openresty -t
    echo "--- Configuration test successful. Starting NGINX. ---"
    exec /usr/local/openresty/bin/openresty -g 'daemon off;'

  nginx.conf: |
    env OIDC_CLIENT_ID;
    env OIDC_CLIENT_SECRET;
    env SESSION_SECRET;

    worker_processes  1;
    events { worker_connections  1024; }

    http {
      map $http_upgrade $connection_upgrade { default upgrade; '' close; }

      lua_shared_dict discovery 10m;
      lua_shared_dict jwks 10m;
      lua_shared_dict sessions 32m;

      resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;
      lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
      lua_ssl_verify_depth 5;

      log_format access_log_format '$remote_addr - $request - $status - $request_time';
      access_log /dev/stdout access_log_format;
      error_log  /dev/stderr  warn;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 7d;
      proxy_send_timeout 7d;
      proxy_buffering off;

      init_by_lua_block {
        auth_utils = require "auth-utils"
        handlers   = require "handlers"
        openidc    = require "resty.openidc"
        cjson      = require "cjson"
        http       = require "resty.http"
      }

      server {
        listen 5173;
        server_name {{ .Values.ui_domain }};

        location /health {
          access_log off;
          return 200 "healthy";
        }

        location / {
          access_by_lua_block {
            handlers.handle_ui_request()
          }
          access_log /dev/stdout access_log_format;
          proxy_pass $dynamic_upstream;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
          proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
          proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;
          proxy_cache_bypass $http_upgrade;
          proxy_read_timeout 7d;
          proxy_send_timeout 7d;
          proxy_buffering off;
        }

        location = /redirect_uri {
          access_by_lua_block {
            handlers.handle_ui_redirect()
          }
        }
      } # End server 5173

      server {
        listen 9000;
        server_name {{ .Values.router_domain }};
        port_in_redirect off;

        set $dynamic_upstream '';
        set $user_email "unauthenticated";

        location = /health {
          access_log off;
          default_type text/plain;
          return 200 "healthy";
        }

        location = /.well-known/oauth-protected-resource {
          add_header 'Access-Control-Allow-Origin' '*' always;
          content_by_lua_block { auth_utils.emit_protected_resource("{{ .Values.router_domain }}") }
        }

        location = /.well-known/oauth-protected-resource/mcp {
          add_header 'Access-Control-Allow-Origin' '*' always;
          content_by_lua_block { auth_utils.emit_protected_resource("{{ .Values.router_domain }}") }
        }

        location = /.well-known/oauth-authorization-server {
          add_header 'Access-Control-Allow-Origin' '*' always;
          content_by_lua_block { auth_utils.emit_authorization_server("{{ .Values.router_domain }}") }
        }

        location = /.well-known/oauth-authorization-server/mcp {
          add_header 'Access-Control-Allow-Origin' '*' always;
          content_by_lua_block { auth_utils.emit_authorization_server("{{ .Values.router_domain }}") }
        }

        location = /.well-known/openid-configuration {
          add_header 'Access-Control-Allow-Origin' '*' always;
          content_by_lua_block { auth_utils.emit_openid_configuration("{{ .Values.router_domain }}") }
        }

        location = /.well-known/openid-configuration/mcp {
          add_header 'Access-Control-Allow-Origin' '*' always;
          content_by_lua_block { auth_utils.emit_openid_configuration("{{ .Values.router_domain }}") }
        }

        location = /mcp/.well-known/openid-configuration {
          add_header 'Access-Control-Allow-Origin' '*' always;
          content_by_lua_block { auth_utils.emit_openid_configuration("{{ .Values.router_domain }}") }
        }

        location = /.well-known/dynamic-client-registration/mcp {
          if ($request_method != POST) { add_header Allow "POST"; return 405; }
          default_type application/json;
          content_by_lua_block {
            ngx.req.read_body()
            local body = ngx.req.get_body_data() or "{}"
            local ok, req = pcall(cjson.decode, body); if not ok then req = {} end
            local want = req.redirect_uris or {}

            local allowed = {
              ["https://{{ .Values.router_domain }}/redirect_uri"] = true,
              ["cursor://anysphere.cursor-mcp/oauth/user-mcpx/callback"] = true,
              ["https://chatgpt.com/connector_platform_oauth_redirect"] = true,
            }
            local final_redirects = {}
            for _, u in ipairs(want) do
              if allowed[u] then table.insert(final_redirects, u) end
            end
            if #final_redirects == 0 then
              final_redirects = {
                "https://{{ .Values.router_domain }}/redirect_uri",
                "cursor://anysphere.cursor-mcp/oauth/user-mcpx/callback",
                "https://chatgpt.com/connector_platform_oauth_redirect"
              }
            end

            local creds = auth_utils.get_oidc_credentials()
            ngx.status = 201
            ngx.say(cjson.encode({
              client_id     = creds.client_id,
              client_secret = creds.client_secret,
              redirect_uris = final_redirects,
              grant_types   = {"authorization_code","refresh_token"},
              response_types= {"code"},
              scope         = "openid email offline_access",
              id_token_signed_response_alg = "RS256",
              application_type = "native",
            }))
          }
        }

        location = /redirect_uri {
          access_by_lua_block {
            local sessions   = ngx.shared.sessions
            local args       = ngx.req.get_uri_args()
            local code       = args.code
            local state      = args.state

            if code and state then
              return auth_utils.handle_oidc_callback(code, state, sessions)
            end

            local new_state, cc, ccm = auth_utils.handle_oidc_redirect(args, sessions)
            local credentials = auth_utils.get_oidc_credentials()
            local auth_url = "{{ .Values.router.oidc.issuerUrl }}/v1/authorize?"
              .. ngx.encode_args({
                response_type         = "code",
                client_id             = credentials.client_id,
                redirect_uri          = "https://{{ .Values.router_domain }}/redirect_uri",
                scope                 = "openid email offline_access",
                state                 = new_state,
                code_challenge        = cc,
                code_challenge_method = ccm,
              })
            return ngx.redirect(auth_url)
          }
        }

        location = /token {
          content_by_lua_block {
            local httpc = http.new()
            local sessions = ngx.shared.sessions

            ngx.req.read_body()
            local args = ngx.req.get_post_args()

            local grant_type   = args.grant_type
            local client_id    = args.client_id
            local client_secret= args.client_secret

            -- Support client_secret_basic as well as client_secret_post
            do
              if (not client_id or not client_secret) then
                local auth = ngx.var.http_authorization
                if auth and auth:find("^Basic%s+") then
                  local b64 = auth:gsub("^Basic%s+", "")
                  local decoded = ngx.decode_base64(b64 or "")
                  if decoded then
                    local cid, csec = decoded:match("^([^:]+):(.*)$")
                    if cid and csec then
                      client_id     = client_id     or cid
                      client_secret = client_secret or csec
                    end
                  end
                end
              end
            end

            if not grant_type then
              ngx.status = 400
              ngx.say('{"error":"invalid_request","error_description":"missing grant_type"}')
              return ngx.exit(ngx.HTTP_BAD_REQUEST)
            end

            if not (client_id and client_secret) then
              ngx.status = 401
              ngx.header["WWW-Authenticate"] = 'Basic realm="token", error="invalid_client", error_description="client authentication required"'
              ngx.say('{"error":"invalid_client","error_description":"client_id/client_secret not provided"}')
              return ngx.exit(ngx.HTTP_UNAUTHORIZED)
            end

            if grant_type == "refresh_token" then
              local refresh_token = args.refresh_token
              if not refresh_token then
                ngx.status = 400
                ngx.say('{"error":"invalid_request","error_description":"missing refresh_token"}')
                return ngx.exit(ngx.HTTP_BAD_REQUEST)
              end

              local token_data, err = auth_utils.validate_refresh_token(refresh_token, sessions)
              if not token_data then
                ngx.status = 400
                ngx.say('{"error":"invalid_grant","error_description":"' .. (err or "invalid refresh token") .. '"}')
                return ngx.exit(ngx.HTTP_BAD_REQUEST)
              end

              local new_refresh_token = auth_utils.generate_refresh_token()
              local new_access_token  = auth_utils.generate_access_token(new_refresh_token)
              auth_utils.store_refresh_token(new_refresh_token, token_data.user_email, token_data.user_sub, sessions)
              auth_utils.revoke_refresh_token(refresh_token, sessions)

              local custom_id_token_payload = {
                iss = "https://" .. ngx.var.host, sub = token_data.user_sub, aud = client_id,
                exp = os.time() + 3600, iat = os.time(),
                email = token_data.user_email, name = token_data.user_email,
              }

              ngx.header["Content-Type"] = "application/json"
              ngx.say(cjson.encode({
                access_token  = new_access_token,
                token_type    = "Bearer",
                expires_in    = 3600,
                refresh_token = new_refresh_token,
                id_token      = cjson.encode(custom_id_token_payload),
              }))
              return ngx.exit(200)
            end

            -- Only authorization_code and refresh_token are supported
            if grant_type ~= "authorization_code" then
              ngx.status = 400
              ngx.say('{"error":"unsupported_grant_type","error_description":"only authorization_code and refresh_token supported"}')
              return ngx.exit(ngx.HTTP_BAD_REQUEST)
            end

            local code          = args.code
            local code_verifier = args.code_verifier
            local redirect_uri  = "https://{{ .Values.router_domain }}/redirect_uri"

            if not code then
              ngx.status = 400
              ngx.say('{"error":"invalid_request","error_description":"missing code"}')
              return ngx.exit(ngx.HTTP_BAD_REQUEST)
            end
            if not code_verifier then
              ngx.status = 400
              ngx.say('{"error":"invalid_request","error_description":"missing code_verifier (PKCE)"}')
              return ngx.exit(ngx.HTTP_BAD_REQUEST)
            end

            local token_url = "{{ .Values.router.oidc.issuerUrl }}/v1/token"
            local token_params = {
              grant_type    = "authorization_code",
              client_id     = client_id,
              client_secret = client_secret,
              code          = code,
              redirect_uri  = redirect_uri,
              code_verifier = code_verifier,
            }

            local res, err = httpc:request_uri(token_url, {
              method = "POST",
              headers = { ["Content-Type"] = "application/x-www-form-urlencoded" },
              body    = ngx.encode_args(token_params),
            })

            local access_token
            local id_token_from_oidc
            if res and res.status == 200 then
              local ok, token_data = pcall(cjson.decode, res.body)
              if ok and token_data and token_data.access_token then
                access_token       = token_data.access_token
                id_token_from_oidc = token_data.id_token
              else
                ngx.status = 500
                ngx.say('{"error":"server_error","error_description":"failed to parse IdP token response"}')
                return ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
              end
            else
              ngx.log(ngx.ERR, "Token exchange failed: ", err or (res and ("HTTP "..res.status..": "..(res.body or ""))) or "unknown")
              ngx.status = 502
              ngx.say('{"error":"server_error","error_description":"IdP token exchange failed"}')
              return ngx.exit(ngx.HTTP_BAD_GATEWAY)
            end

            local user_email, user_sub, user_name = "unknown", "unknown", "unknown"
            if access_token then
              local userinfo_url = "{{ .Values.router.oidc.issuerUrl }}/v1/userinfo"
              local userinfo_res = httpc:request_uri(userinfo_url, {
                method = "GET", headers = { ["Authorization"] = "Bearer " .. access_token }
              })
              if userinfo_res and userinfo_res.status == 200 then
                local ok, info = pcall(cjson.decode, userinfo_res.body)
                if ok and info then
                  user_email = info.email or info.sub
                  user_sub   = info.sub
                  user_name  = info.name or info.email or info.sub
                end
              end
            end

            local final_id_token = id_token_from_oidc
            if not final_id_token then
              final_id_token = cjson.encode({
                iss = "https://" .. ngx.var.host, sub = user_sub, aud = client_id,
                exp = os.time() + 3600, iat = os.time(),
                email = user_email, name = user_name,
              })
            end

            if user_email and user_email ~= "unknown" then
              local user_prefix = auth_utils.extract_user_prefix(user_email)
              if user_prefix then
                ngx.log(ngx.DEBUG, "[Token] notifying MCPx for user: ", user_email)
                local token_to_send = id_token_from_oidc or cjson.encode({
                  user_email = user_email, user_sub = user_sub, auth_type = "token_endpoint", timestamp = os.time()
                })
                auth_utils.notify_mcpx_of_login(token_to_send, user_prefix)
              end
            end

            ngx.header["Content-Type"] = "application/json"

            local refresh_token
            if user_email and user_sub then
              refresh_token = auth_utils.generate_refresh_token()
              auth_utils.store_refresh_token(refresh_token, user_email, user_sub, sessions)
            end
            local custom_access_token = refresh_token and auth_utils.generate_access_token(refresh_token) or access_token

            ngx.say(cjson.encode({
              access_token  = custom_access_token,
              token_type    = "Bearer",
              expires_in    = 3600,
              id_token      = final_id_token,
              refresh_token = refresh_token
            }))
            return ngx.exit(200)
          }
        }

        # Friendly failure
        location = /auth-failed {
          return 400 "Authentication Failed. Please try again.";
        }

        location /mcp {
          default_type application/json;
          access_by_lua_block {
            local auth_header = ngx.var.http_authorization
            auth_utils.log_auth_attempt(ngx.var.remote_addr, auth_header)

            local user_email, err = auth_utils.validate_bearer_token(auth_header)

            if not user_email then
              ngx.log(ngx.ERR, "[/mcp] Authentication failed: ", err or "No valid Bearer token")
              return auth_utils.send_unauthorized("Authentication required",
                string.format("%s://%s/login", ngx.var.scheme, ngx.var.host))
            end

            local success = auth_utils.setup_user_routing(user_email, 9000)
            if not success then
              return -- Error already handled in setup_user_routing
            end

            ngx.log(ngx.DEBUG, "[/mcp] Successfully set dynamic upstream to: ", ngx.var.dynamic_upstream)
          }

          proxy_pass $dynamic_upstream;
          proxy_set_header Host $host;
          proxy_set_header Cookie $http_cookie;
          proxy_set_header X-User-Email $user_email;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_connect_timeout 7d;
          proxy_send_timeout 7d;
          proxy_read_timeout 7d;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
        }
      }
    }

  handlers.lua: |
    local handlers = {}
    local openidc = require "resty.openidc"
    local auth_utils = require "auth-utils"
    local cjson = require "cjson"

    function handlers.handle_ui_request()
      local redirect_uri = "https://{{ .Values.ui_domain }}/redirect_uri"
      local session_opts = auth_utils.get_session_config()
      local oidc_opts = auth_utils.get_oidc_config(redirect_uri)

      local res, err, _, session = openidc.authenticate(oidc_opts, nil, nil, session_opts)
      if err then
        return ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
      end

      if res and res.id_token then
        local user_email = res.id_token.email or "unknown"
        ngx.req.set_header("X-Auth-Email", user_email)
        ngx.var.user_email = user_email

        local user_prefix = auth_utils.extract_user_prefix(user_email)
        if not user_prefix then
          return auth_utils.send_bad_request("Invalid email format")
        end

        local session_data = session.data[1] and session.data[1][1] or session.data
        local raw_jwt = session_data.enc_id_token or session_data.raw_id_token or session_data.id_token_raw
        if not raw_jwt and res then
          raw_jwt = res.enc_id_token or res.raw_id_token or res.id_token_raw
        end

        -- if raw_jwt then
        --   ngx.log(ngx.INFO, "Notifying MCPx of login for user: ", user_email)
        --   ngx.log(ngx.INFO, "Token ID: ", raw_jwt)
        --   auth_utils.notify_mcpx_of_login(raw_jwt, user_prefix)
        -- else
        --   ngx.log(ngx.INFO, "No raw JWT found in session for user: ", user_email)
        -- end

        local target_port
        if ngx.var.uri:match("^/auth/initiate") or ngx.var.uri:match("^/ws%-ui") or ngx.var.http_upgrade == "websocket" then
          target_port = 9000
        else
          target_port = 5173
        end

        ngx.var.dynamic_upstream = auth_utils.build_dynamic_upstream(user_prefix, target_port)
      end
    end

    function handlers.handle_ui_redirect()
      local redirect_uri = "https://{{ .Values.ui_domain }}/redirect_uri"
      local oidc_opts = auth_utils.get_oidc_config(redirect_uri)
      local session_opts = auth_utils.get_session_config()

      local res, err, _, session = openidc.authenticate(oidc_opts, nil, nil, session_opts)
      if err then
        ngx.log(ngx.ERR, "[UI Redirect] Error during OIDC authenticate: ", err)
        return ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
      end
    end

    return handlers

  auth-utils.lua: |
    local cjson    = require "cjson"
    local http     = require "resty.http"
    local openidc  = require "resty.openidc"
    local session  = require "resty.session"
    local random   = require "resty.random"

    local _M = {}

    function _M.emit_protected_resource(domain)
      ngx.header["Content-Type"] = "application/json"
      ngx.say(cjson.encode({
        authorization_servers = { "https://" .. domain .. "/.well-known/oauth-authorization-server/mcp" }
      }))
    end

    function _M.emit_authorization_server(domain)
      ngx.header["Content-Type"] = "application/json"
      ngx.say(cjson.encode({
        issuer                               = "https://" .. domain,
        authorization_endpoint               = "https://" .. domain .. "/redirect_uri",
        token_endpoint                       = "https://" .. domain .. "/token",
        registration_endpoint                = "https://" .. domain .. "/.well-known/dynamic-client-registration/mcp",
        response_types_supported             = { "code" },
        grant_types_supported                = { "authorization_code", "refresh_token" },
        code_challenge_methods_supported     = { "S256" },
        scopes_supported                     = { "openid", "email", "offline_access" }
      }))
    end

    function _M.emit_openid_configuration(domain)
      ngx.header["Content-Type"] = "application/json"
      ngx.say(cjson.encode({
        issuer                               = "https://" .. domain,
        authorization_endpoint               = "https://" .. domain .. "/redirect_uri",
        token_endpoint                       = "https://" .. domain .. "/token",
        registration_endpoint                = "https://" .. domain .. "/.well-known/dynamic-client-registration/mcp",
        response_types_supported             = { "code" },
        grant_types_supported                = { "authorization_code", "refresh_token" },
        code_challenge_methods_supported     = { "S256" },
        scopes_supported                     = { "openid", "email", "offline_access" }
      }))
    end

    function _M.get_oidc_config(redirect_uri)
      return {
        discovery        = "{{ .Values.router.oidc.issuerUrl }}/.well-known/openid-configuration",
        client_id        = os.getenv("OIDC_CLIENT_ID"),
        client_secret    = os.getenv("OIDC_CLIENT_SECRET"),
        redirect_uri     = redirect_uri,
        scope            = "openid email offline_access",
        use_pkce         = true,
        use_nonce        = false,
        session_storage  = "cookie",
        session_contents = { id_token = true, enc_id_token = true, access_token = true },
        lifecycle        = { on_authenticated = _M.on_authenticated_callback }
      }
    end

    function _M.on_authenticated_callback(sess, id_token, token_response)
      if not id_token then
        ngx.log(ngx.ERR, "[on_authenticated] nil id_token")
        return
      end
      local user_email  = id_token.email or "unknown"
      local user_prefix = _M.extract_user_prefix(user_email)
      if not user_prefix then
        ngx.log(ngx.WARN, "[on_authenticated] cannot extract prefix from: ", user_email)
        return
      end
      local sd = sess.data[1] and sess.data[1][1] or sess.data
      local raw_jwt = sd.enc_id_token or sd.raw_id_token or sd.id_token_raw or (token_response and token_response.id_token)
      if raw_jwt then _M.notify_mcpx_of_login(raw_jwt, user_prefix) end
    end

    function _M.get_session_config()
      return {
        secret            = os.getenv("SESSION_SECRET") or "fallback-secret-key-for-testing",
        storage           = "cookie",
        cookie_name       = "hive_session",
        cookie_path       = "/",
        cookie_domain     = ".{{ .Values.domain }}",
        cookie_http_only  = true,
        cookie_secure     = true,
        cookie_same_site  = "None",
        cipher            = "aes-256-cbc",
        hmac              = "sha256",
        expires           = 86400,
        encrypt           = true,
      }
    end

    function _M.extract_user_prefix(user_email)
      if not user_email then return nil end
      return string.match(user_email, "^([^@]+)")
    end

    function _M.build_dynamic_upstream(user_prefix, target_port)
      local base = "http://mcpx-" .. user_prefix .. ".{{ $.Release.Namespace }}.svc.cluster.local"
      return string.format("%s:%d", base, tonumber(target_port or 9000))
    end

    function _M.send_unauthorized(message, auth_url)
      ngx.status = 401
      ngx.header["WWW-Authenticate"] = 'Bearer realm="mcp", error="invalid_token", error_description="' ..
        (message or "Authentication required") .. '"'
      if auth_url then ngx.header["X-Cursor-Auth-URL"] = auth_url end
      ngx.say(cjson.encode({ error = message or "Authentication required" }))
      return ngx.exit(ngx.HTTP_UNAUTHORIZED)
    end

    function _M.send_bad_request(message)
      ngx.status = 400
      ngx.say(cjson.encode({ error = message or "Bad request" }))
      return ngx.exit(ngx.HTTP_BAD_REQUEST)
    end

    function _M.validate_bearer_token(auth_header)
    if not auth_header or auth_header:find("^Bearer%s+") ~= 1 then
        return nil, "No Bearer token found"
    end

    local token = auth_header:match("^Bearer%s+(.+)")
    if not token then
        return nil, "Invalid Bearer token format"
    end

    local sessions = ngx.shared.sessions

    -- 1) Try standard JWT verification via lua-resty-openidc
    local opts = _M.get_oidc_validation_config()
    local claims, verr = require("resty.openidc").bearer_jwt_verify(opts)
    if not verr then
        if claims and claims.email then
        ngx.ctx.openidc_claims = claims
        return claims.email, nil
        end
    else
        ngx.log(ngx.DEBUG, "[validate_bearer_token] JWT verify failed: ", verr)
    end

    -- 2) Fallback: custom “access_” prefix logic (your refresh-token design)
    if token:match("^access_") then
        local refresh_token = token:sub(8)  -- remove prefix "access_"
        local td, err = _M.validate_refresh_token(refresh_token, sessions)
        if not td then
        return nil, "Invalid access token: " .. (err or "unknown")
        end
        return td.user_email, nil
    end

    -- 3) If neither path succeeded
    return nil, "Token not recognized or invalid"
    end

    function _M.setup_user_routing(user_email, target_port)
      local user_prefix = _M.extract_user_prefix(user_email)
      if not user_prefix then
        ngx.log(ngx.ERR, "Invalid/missing email: ", user_email or "nil")
        return _M.send_bad_request("Invalid email format")
      end
      ngx.var.dynamic_upstream = _M.build_dynamic_upstream(user_prefix, target_port)
      ngx.var.user_email       = user_email
      ngx.req.set_header("X-Auth-Email", user_email)
      ngx.log(ngx.DEBUG, "[/mcp] Successfully set dynamic upstream to: ", ngx.var.dynamic_upstream)
      return true
    end

    function _M.log_auth_attempt(ip, auth_header)
      ngx.log(ngx.DEBUG, "[/mcp] From IP: ", ip or "unknown")
      ngx.log(ngx.DEBUG, "[/mcp] Authorization header present: ", auth_header and "yes" or "no")
    end

    function _M.generate_oidc_state(agent_state)
      if agent_state and agent_state ~= "none" and agent_state ~= "" then
        return agent_state, agent_state
      end
      local rb = random.bytes(16)
      local hex = {}
      for i = 1, #rb do hex[#hex+1] = string.format("%02x", string.byte(rb, i)) end
      local s = table.concat(hex)
      return s, s
    end

    function _M.handle_oidc_redirect(args, sessions)
      local agent_code_challenge        = args.code_challenge
      local agent_code_challenge_method = args.code_challenge_method
      local agent_redirect_uri         = args.redirect_uri
      local agent_state                = args.state
      local agent_client_id            = args.client_id

      local oidc_state, final_agent_state = _M.generate_oidc_state(agent_state)
      sessions:set("oidc_state_" .. oidc_state, cjson.encode({
        agent_code_challenge        = agent_code_challenge,
        agent_code_challenge_method = agent_code_challenge_method,
        agent_redirect_uri         = agent_redirect_uri,
        agent_state                = final_agent_state,
        agent_client_id            = agent_client_id
      }), 300)

      return oidc_state, agent_code_challenge, agent_code_challenge_method
    end

    function _M.get_oidc_validation_config()
      return {
        discovery   = "{{ .Values.router.oidc.issuerUrl }}/.well-known/openid-configuration",
        client_id   = os.getenv("OIDC_CLIENT_ID"),
        client_secret = os.getenv("OIDC_CLIENT_SECRET"),
        ssl_verify  = true,
        token_signing_alg_values_expected = { "RS256" },
      }
    end

    function _M.get_oidc_credentials()
      return {
        client_id     = os.getenv("OIDC_CLIENT_ID"),
        client_secret = os.getenv("OIDC_CLIENT_SECRET"),
      }
    end

    function _M.generate_refresh_token()
      local rb = random.bytes(32)
      local hex = {}
      for i = 1, #rb do hex[#hex+1] = string.format("%02x", string.byte(rb, i)) end
      return table.concat(hex)
    end

    function _M.generate_access_token(refresh_token)
      return "access_" .. refresh_token
    end

    function _M.store_refresh_token(refresh_token, user_email, user_sub, sessions)
      local payload = {
        user_email = user_email,
        user_sub   = user_sub,
        created_at = os.time(),
        expires_at = os.time() + 30 * 24 * 60 * 60
      }
      sessions:set("refresh_token_" .. refresh_token, cjson.encode(payload), 30 * 24 * 60 * 60)
    end

    function _M.validate_refresh_token(refresh_token, sessions)
      local raw = sessions:get("refresh_token_" .. refresh_token)
      if not raw then return nil, "Invalid refresh token" end
      local ok, data = pcall(cjson.decode, raw)
      if not (ok and data) then return nil, "Invalid refresh token data" end
      if os.time() > data.expires_at then
        sessions:delete("refresh_token_" .. refresh_token)
        return nil, "Refresh token expired"
      end
      return data, nil
    end

    function _M.revoke_refresh_token(refresh_token, sessions)
      sessions:delete("refresh_token_" .. refresh_token)
    end

    function _M.notify_mcpx_of_login(token_id, user_prefix)
      if not (token_id and user_prefix) then
        ngx.log(ngx.ERR, "notify_mcpx_of_login: missing token_id or user_prefix")
        return
      end
      local ok, err = ngx.timer.at(0, function(premature, tkn, prefix)
        if premature then return end
        local dest = "http://mcpx-" .. prefix .. ".{{ $.Release.Namespace }}.svc.cluster.local:9000"
        local httpc = http.new()
        httpc:set_timeout(5000)
        local res, rerr = httpc:request_uri(dest .. "/auth/mcpx", {
          method  = "POST",
          body    = cjson.encode({ token = tkn }),
          headers = { ["Content-Type"] = "application/json" }
        })
        if not res then
          ngx.log(ngx.WARN, "notify_mcpx_of_login failed: ", rerr or "unknown")
          return
        end
        if res.status < 200 or res.status >= 300 then
          ngx.log(ngx.WARN, "notify_mcpx_of_login non-2xx: ", res.status, " body=", res.body or "")
        end
      end, token_id, user_prefix)
      if not ok then ngx.log(ngx.ERR, "Failed to schedule notify_mcpx_of_login: ", err) end
    end

    function _M.handle_oidc_callback(oidc_code, oidc_state, sessions)
      local raw = sessions:get("oidc_state_" .. oidc_state)
      if not raw then return ngx.redirect("/auth-failed") end
      local ok, data = pcall(cjson.decode, raw)
      if not (ok and data) then return ngx.redirect("/auth-failed") end

      local agent_redirect_uri = data.agent_redirect_uri
      local agent_state        = data.agent_state
      if not (agent_redirect_uri and agent_state) then return ngx.redirect("/auth-failed") end

      local cb = string.format("%s?code=%s&state=%s",
        agent_redirect_uri, ngx.escape_uri(oidc_code), ngx.escape_uri(agent_state))
      return ngx.redirect(cb)
    end

    return _M
