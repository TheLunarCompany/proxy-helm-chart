apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcpx-hive.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "mcpx-hive.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: router
    app.kubernetes.io/part-of: {{ include "mcpx-hive.name" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
data:
  OIDC_ISSUER_URL: {{ .Values.router.oidc.issuerUrl | b64enc | quote }}
  OIDC_CLIENT_ID: {{ .Values.router.oidc.clientId | b64enc | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.router.oidc.clientSecret | b64enc | quote }}
  SESSION_SECRET: {{ .Values.router.oidc.sessionSecret | b64enc | quote }}
  REDIS_URL: {{ .Values.router.redis.url | b64enc | quote }}
  REDIS_IS_CLUSTER: {{ .Values.router.redis.isCluster | toString | b64enc | quote }}

