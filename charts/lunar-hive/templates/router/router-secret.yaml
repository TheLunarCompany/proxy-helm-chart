{{- $defaults := fromYaml (.Files.Get "internal-values.yaml") -}}
{{- $values := mergeOverwrite (deepCopy $defaults) .Values -}}
{{- $ctx := dict "Values" $values "Chart" .Chart "Release" .Release "Capabilities" .Capabilities "Files" .Files "Template" .Template "Subcharts" .Subcharts -}}
{{- with $ctx }}
{{- $oidcIssuer := default "" .Values.global.oidc.issuerUrl }}
{{- $oidcClientID := default "" .Values.global.oidc.clientId }}
{{- $oidcClientSecret := default "" .Values.global.oidc.clientSecret }}
{{- $sessionSecret := default "" .Values.global.oidc.sessionSecret }}
{{- $redisPrefix := default "" .Values.global.redis.prefix }}
{{- $redisURL := default "" .Values.global.redis.url }}
{{- $redisIsCluster := default false .Values.global.redis.isCluster }}
{{- $redisDeploy := default false .Values.global.redis.deploy }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcpx-hive.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "mcpx-hive.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: router
    app.kubernetes.io/part-of: {{ include "mcpx-hive.name" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
data:
  OIDC_ISSUER_URL: {{ $oidcIssuer | b64enc | quote }}
  OIDC_CLIENT_ID: {{ $oidcClientID | b64enc | quote }}
  OIDC_CLIENT_SECRET: {{ $oidcClientSecret | b64enc | quote }}
  SESSION_SECRET: {{ $sessionSecret | b64enc | quote }}
  REDIS_URL: {{ if $redisDeploy }}{{ printf "redis://%s-redis.%s.svc.cluster.local:%d" (include "mcpx-hive.name" .) .Release.Namespace (int (default 6379 .Values.redis.service.port)) | b64enc | quote }}{{ else }}{{ $redisURL | b64enc | quote }}{{ end }}
  REDIS_IS_CLUSTER: {{ $redisIsCluster | toString | b64enc | quote }}
  REDIS_PREFIX: {{ $redisPrefix | b64enc | quote }}
{{- end }}
