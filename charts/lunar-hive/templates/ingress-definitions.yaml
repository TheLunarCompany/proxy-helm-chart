{{- if .Values.ingress.enabled | default true }}
{{- $fullname := include "mcpx-hive.fullname" . }}
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: {{ printf "%s-cert" $fullname }}
  labels:
    name: {{ printf "%s-cert" $fullname }}
    app: {{ printf "%s-cert" $fullname }}
spec:
  domains:
    {{- range $key, $value := .Values.ingress.domains }}
    {{- range $value }}
    - {{ .host }}
    {{- end }}
    {{- end }}

---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: {{ printf "%s-frontendconfig" $fullname }}
spec:
  redirectToHttps:
    enabled: true
    responseCodeName: "302"

---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ printf "%s-backendconfig" $fullname }}
  labels:
    name: {{ printf "%s-backendconfig" $fullname }}
    app: {{ printf "%s-backendconfig" $fullname }}
spec:
  timeoutSec: 3600
  connectionDraining:
    drainingTimeoutSec: 60
  sessionAffinity:
    affinityType: "CLIENT_IP"
    affinityCookieTtlSec: 3600
  healthCheck:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /health
    port: 9000

---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ printf "%s-websocket-backendconfig" $fullname }}
  labels:
    name: {{ printf "%s-websocket-backendconfig" $fullname }}
    app: {{ printf "%s-websocket-backendconfig" $fullname }}
spec:
  timeoutSec: 3600
  connectionDraining:
    drainingTimeoutSec: 60
  sessionAffinity:
    affinityType: "CLIENT_IP"
    affinityCookieTtlSec: 3600
  healthCheck:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /health
    port: 5173

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ printf "%s-ingress" $fullname }}
  labels:
    app.kubernetes.io/name: {{ include "mcpx-hive.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: {{ include "mcpx-hive.name" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    {{- if eq .Values.ingress.type "gce" }}
    kubernetes.io/ingress.class: "gce"
    {{- if .Values.global.staticIPName }}
    networking.gke.io/static-ip: {{ .Values.global.staticIPName }}
    kubernetes.io/ingress.global-static-ip-name: {{ .Values.global.staticIPName }}
    {{- end }}
    networking.gke.io/managed-certificates: {{ printf "%s-cert" $fullname }}
    networking.gke.io/v1beta1.FrontendConfig: {{ printf "%s-frontendconfig" $fullname }}
    cloud.google.com/backend-config: '{"default": "{{ printf "%s-backendconfig" $fullname }}"}'
    {{- else }}
    # Future ingress types will be added here
    {{- end }}
    {{- if .Values.ingress.annotations }}
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    {{- end }}
spec:
  rules:
    {{- range $key, $value := .Values.ingress.domains }}
    {{- range $value }}
    - host: {{ .host }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ if or (eq .backend.serviceName "router") (eq .backend.serviceName "ui") }}mcpx-hive-router{{ else }}{{ printf "%s-%s" $.Release.Name .backend.serviceName }}{{ end }}
                port:
                  number: {{ .backend.servicePort }}
          {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
