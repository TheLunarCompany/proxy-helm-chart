{{- $defaults := fromYaml (.Files.Get "internal-values.yaml") -}}
{{- $values := mergeOverwrite (deepCopy $defaults) .Values -}}
{{- $ctx := dict "Values" $values "Chart" .Chart "Release" .Release "Capabilities" .Capabilities "Files" .Files "Template" .Template "Subcharts" .Subcharts -}}
{{- with $ctx }}
{{- $root := . }}
{{- if and .Values.mcpxUi.enabled .Values.mcpxUi.service }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.mcpxUi.service.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "mcpx-hive.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mcpx-ui
    app.kubernetes.io/part-of: {{ include "mcpx-hive.name" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  {{- $ann := dict }}
  {{- if .Values.mcpxUi.service.annotations }}
    {{- $_ := merge $ann .Values.mcpxUi.service.annotations }}
  {{- end }}
  {{- if .Values.ingress.gcp }}
    {{- if not (hasKey $ann "cloud.google.com/neg") }}
      {{- $_ := set $ann "cloud.google.com/neg" "{\"ingress\": true}" }}
    {{- end }}
    {{- $fullname := include "mcpx-hive.fullname" . }}
    {{- $uiPortName := "ui" }}
    {{- range .Values.mcpxUi.service.ports }}
      {{- if eq (toString .targetPort) (toString $root.Values.mcpxUi.containerPort) }}
        {{- $uiPortName = .name | default "ui" }}
      {{- end }}
    {{- end }}
    {{- $_ := set $ann "cloud.google.com/backend-config" (printf "{\"ports\": {\"%s\": \"%s-websocket-backendconfig\"}}" $uiPortName $fullname) }}
  {{- else if .Values.ingress.aws }}
    {{- if not (hasKey $ann "service.beta.kubernetes.io/aws-load-balancer-type") }}
      {{- $_ := set $ann "service.beta.kubernetes.io/aws-load-balancer-type" "nlb" }}
    {{- end }}
    {{- if .Values.ingress.aws.securityGroups }}
      {{- $_ := set $ann "service.beta.kubernetes.io/aws-load-balancer-security-groups" (join "," .Values.ingress.aws.securityGroups) }}
    {{- end }}
    {{- if .Values.ingress.aws.elasticIPs }}
      {{- $_ := set $ann "service.beta.kubernetes.io/aws-load-balancer-eip-allocations" (join "," .Values.ingress.aws.elasticIPs) }}
    {{- end }}
  {{- else if .Values.ingress.azure }}
    {{- if not (hasKey $ann "service.beta.kubernetes.io/azure-load-balancer-resource-group") }}
      {{- $_ := set $ann "service.beta.kubernetes.io/azure-load-balancer-resource-group" (.Values.ingress.azure.resourceGroup | default "") }}
    {{- end }}
    {{- if .Values.ingress.azure.staticIP }}
      {{- $_ := set $ann "service.beta.kubernetes.io/azure-load-balancer-ipv4" .Values.ingress.azure.staticIP }}
    {{- end }}
  {{- end }}
  {{- if $ann }}
  annotations:
    {{- toYaml $ann | nindent 4 }}
  {{- end }}
spec:
  {{- $svcType := .Values.mcpxUi.service.type }}
  {{- if .Values.ingress.gcp }}
  {{- $svcType = "ClusterIP" }}
  {{- else if .Values.ingress.aws }}
  {{- $svcType = "NodePort" }}
  {{- end }}
  type: {{ $svcType }}
  ports:
    {{- toYaml .Values.mcpxUi.service.ports | nindent 4 }}
  selector:
    app.kubernetes.io/name: {{ include "mcpx-hive.name" . }}
    app.kubernetes.io/component: mcpx-ui
{{- end }}
{{- end }}
