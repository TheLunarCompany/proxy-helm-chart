{{- $defaults := fromYaml (.Files.Get "internal-values.yaml") -}}
{{- $values := mergeOverwrite (deepCopy $defaults) .Values -}}
{{- $ctx := dict "Values" $values "Chart" .Chart "Release" .Release "Capabilities" .Capabilities "Files" .Files "Template" .Template "Subcharts" .Subcharts -}}
{{- with $ctx }}
{{- if .Values.mcpxUi.enabled }}
{{- $uiEnv := default dict .Values.mcpxUi.env }}
{{- $routerDomain := default "" .Values.router_domain }}
{{- $mcpxUiImage := default dict .Values.mcpxUi.image }}
{{- $mcpxUiRepo := default (dig "mcpxUi" "image" "repository" $defaults) $mcpxUiImage.repository }}
{{- $mcpxUiTag := default (dig "mcpxUi" "image" "tag" $defaults) $mcpxUiImage.tag }}
{{- $mcpxUiPullPolicy := default (dig "mcpxUi" "image" "pullPolicy" $defaults) $mcpxUiImage.pullPolicy }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcpx-hive.name" . }}-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "mcpx-hive.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mcpx-ui
    app.kubernetes.io/part-of: {{ include "mcpx-hive.name" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.mcpxUi.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mcpx-hive.name" . }}
      app.kubernetes.io/component: mcpx-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "mcpx-hive.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: mcpx-ui
        app.kubernetes.io/part-of: {{ include "mcpx-hive.name" . }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: mcpx-ui
          image: "{{ $mcpxUiRepo }}:{{ default .Chart.AppVersion $mcpxUiTag }}"
          imagePullPolicy: {{ $mcpxUiPullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ .Values.mcpxUi.containerPort }}
              name: ui
          env:
            {{- range $key, $value := $uiEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if not (hasKey $uiEnv "VITE_MCPX_SERVER_URL") }}
            - name: VITE_MCPX_SERVER_URL
              value: {{ printf "https://%s" $routerDomain | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.mcpxUi.resources | nindent 12 }}
      {{- with .Values.mcpxUi.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcpxUi.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcpxUi.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
