{{- if .Values.hiveController.service.enabled | default true }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcpx-hive.controller.fullname" . }}
  labels:
    {{- include "mcpx-hive.controller.labels" . | nindent 4 }}
  {{- $ann := dict }}
  {{- if .Values.hiveController.service.annotations }}
    {{- $_ := merge $ann .Values.hiveController.service.annotations }}
  {{- end }}
  {{- if and (eq .Values.global.cloudProvider "gcp") (not (hasKey $ann "cloud.google.com/neg")) }}
    {{- $_ := set $ann "cloud.google.com/neg" "{\"ingress\": true}" }}
  {{- end }}
  {{- if $ann }}
  annotations:
    {{- toYaml $ann | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.hiveController.service.type }}
  {{- if eq .Values.hiveController.service.type "LoadBalancer" }}
  loadBalancerIP: {{ .Values.hiveController.service.loadBalancerIP }}
  {{- end }}
  ports:
    - port: {{ .Values.hiveController.service.port }}
      targetPort: {{ .Values.hiveController.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "mcpx-hive.controller.selectorLabels" . | nindent 4 }}
{{- end }} 