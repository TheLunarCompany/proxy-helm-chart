{{- $defaults := fromYaml (.Files.Get "internal-values.yaml") -}}
{{- $values := mergeOverwrite (deepCopy $defaults) .Values -}}
{{- $ctx := dict "Values" $values "Chart" .Chart "Release" .Release "Capabilities" .Capabilities "Files" .Files "Template" .Template "Subcharts" .Subcharts -}}
{{- with $ctx }}
{{- $controllerToken := default .Values.global.controllerToken .Values.hiveController.controllerToken }}
{{- if $controllerToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcpx-hive.controller.fullname" . }}-token
  labels:
    {{- include "mcpx-hive.controller.labels" . | nindent 4 }}
type: Opaque
stringData:
  controller-token: {{ $controllerToken | quote }}
{{- end }}
{{- end }}
