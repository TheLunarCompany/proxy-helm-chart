{{- $defaults := fromYaml (.Files.Get "internal-values.yaml") -}}
{{- $values := mergeOverwrite (deepCopy $defaults) .Values -}}
{{- $ctx := dict "Values" $values "Chart" .Chart "Release" .Release "Capabilities" .Capabilities "Files" .Files "Template" .Template "Subcharts" .Subcharts -}}
{{- with $ctx }}
{{- $env := deepCopy .Values.hiveController.env }}
{{- $globalLogLevel := default "info" .Values.global.logLevel }}
{{- $uiConfig := default dict .Values.mcpxUi }}
{{- $uiService := default dict $uiConfig.service }}
{{- $uiServiceName := default "mcpx-ui" $uiService.name }}
{{- if not (hasKey $env "LOG_LEVEL") }}
{{- $_ := set $env "LOG_LEVEL" $globalLogLevel }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcpx-hive.controller.fullname" . }}
  labels:
    {{- include "mcpx-hive.controller.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hiveController.autoscaling.enabled }}
  replicas: {{ .Values.hiveController.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mcpx-hive.controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcpx-hive.controller.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mcpx-hive.controller.serviceAccountName" . }}
      automountServiceAccountToken: true
      
      securityContext:
        {{- toYaml .Values.hiveController.podSecurityContext | nindent 8 }}
      containers:
        - name: hive-controller
          securityContext:
            {{- toYaml .Values.hiveController.securityContext | nindent 12 }}
          image: "{{ .Values.hiveController.image.repository }}:{{ default .Chart.AppVersion .Values.hiveController.image.tag }}"
          imagePullPolicy: {{ .Values.hiveController.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.hiveController.env.PORT | default 8080 }}
              protocol: TCP
          env:
            # Source namespace from the Pod runtime environment to avoid drift
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- range $key, $value := $env }}
            {{- if and (ne $key "KUBERNETES_NAMESPACE") (ne $key "ROUTER_DOMAIN") }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- if hasKey $env "ROUTER_DOMAIN" }}
            - name: ROUTER_DOMAIN
              value: {{ .Values.router_domain | quote }}
            {{- end }}
            {{- if .Values.ui_domain }}
            - name: UI_DOMAIN
              value: {{ .Values.ui_domain | quote }}
            {{- end }}
            - name: UI_SERVICE_NAME
              value: "{{ $uiServiceName }}"
            {{- if .Values.global.hubUrl }}
            - name: HUB_WS_URL
              value: {{ .Values.global.hubUrl | quote }}
            {{- end }}
          {{- if .Values.hiveController.probes.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.hiveController.probes.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.hiveController.probes.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.hiveController.probes.readinessProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.hiveController.resources | nindent 12 }}
      {{- with .Values.hiveController.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hiveController.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hiveController.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
