# MCPx Hive Helm Chart Values
# This chart deploys MCPx Hive with cloud-agnostic configuration
# For cloud-specific features, use Terraform or override values

# --- Domain Configuration ---
domain: "lunar.dev"
controller_domain: &controller_domain "controller-stg.lunar.dev"
ui_domain: &ui_domain "mcpx-ui-stg.lunar.dev"
router_domain: &router_domain "mcpx-stg.lunar.dev"
ingress_class: &ingress_class "gce"

global:
  clusterDomain: "cluster.local"
  imagePullSecrets:
    - lunar-private-mcpx-registry

  # --- GCP Specific Configuration ---
  # These values are used when cloudProvider is "gcp"
  # Example for GCP standalone deployment:
  # staticIPName: "mcpx-hive-static-ip"
  staticIPName: "lunar-mcpx-hive" # Optional unified static IP name for GCP; if set, overrides per-ingress staticIPName

crds:
  enabled: true

hiveController:
  image:
    repository: "us-central1-docker.pkg.dev/prj-common-442813/lunar-private/mcpx-hive-controller"
    tag: "b223d43"
    pullPolicy: "IfNotPresent"

  imagePullSecrets: []

  replicaCount: 1

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  service:
    enabled: true
    type: "ClusterIP"
    port: 80
    targetPort: 8080

  serviceAccount:
    create: true
    annotations: {}
    name: ""

  rbac:
    create: true

  autoscaling:
    enabled: false

  env:
    PORT: 8080
    LOG_LEVEL: info
    MCPX_API_VERSION: hive.lunar.dev/v1alpha1
    MCPX_KIND: MCPx
    ROUTER_DOMAIN: "" # Will be set from .Values.router_domain in deployment template

  # Optional: name/key of a secret containing the controller API token
  controllerTokenSecret:
    name: "" # e.g. mcpx-controller-token
    key: token

  # Health check probes
  probes:
    livenessProbe:
      httpGet:
        path: /health/live
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 10
    readinessProbe:
      httpGet:
        path: /health/ready
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000

  podSecurityContext:
    fsGroup: 2000
    runAsNonRoot: true
    runAsUser: 1000

  affinity: {}
  tolerations: []
  nodeSelector: {}

# Router deployment & service configuration
router:
  enabled: true
  replicaCount: 1
  image:
    repository: "openresty/openresty"
    tag: "1.27.1.2-4-alpine-fat"
    pullPolicy: "IfNotPresent"
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    name: "mcpx-hive-router"
    type: ClusterIP
    ports:
      - name: ui
        port: 5173
        targetPort: 5173
      - name: mcpx-server
        port: 9000
        targetPort: 9000
      - name: metrics
        port: 3000
        targetPort: 3000

  # OIDC configuration for authentication
  # Example for GCP standalone deployment:
  # oidc:
  #   issuerUrl: "https://trial-8582005.okta.com/oauth2/default"
  #   clientId: "0oawaaedip5wphNgD697"
  #   clientSecret: "q_hSiUn19oKIheKbrTaHX_tN21d3-Ojwo13VssWxWekI3JT3CXGuCAFiuuFE30ah"
  #   sessionSecret: "dev-session-secret-change-in-production"
  oidc:
    issuerUrl: "https://trial-8582005.okta.com/oauth2/default"
    clientId: "0oawaaedip5wphNgD697"
    clientSecret: "q_hSiUn19oKIheKbrTaHX_tN21d3-Ojwo13VssWxWekI3JT3CXGuCAFiuuFE30ah"
    sessionSecret: "dev-session-secret-change-in-production"

ingress:
  enabled: true
  type: *ingress_class
  className: *ingress_class
  domains:
    controller:
      - host: *controller_domain
        paths:
          - path: /
            pathType: Prefix
            backend:
              serviceName: "controller"
              servicePort: 80
    router:
      - host: *router_domain
        paths:
          - path: /
            pathType: Prefix
            backend:
              serviceName: "router"
              servicePort: 9000
    ui:
      - host: *ui_domain
        paths:
          - path: /
            pathType: Prefix
            backend:
              serviceName: "router"
              servicePort: 5173
  annotations: {}
  # Additional annotations can be added here
  # key: value
