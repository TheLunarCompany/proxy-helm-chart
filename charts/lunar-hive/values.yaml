# MCPx Hive Helm Chart Values

# --- Domain Configuration ---
# Set the public domains for the Hive components (required)
domain: ""
controller_domain: "" # e.g. mcpx-controller-<env>.<domain>
ui_domain: "" # e.g. mcpx-ui-<env>.<domain>
router_domain: "" # e.g. mcpx-<env>.<domain>

global:
  logLevel: "warn"
  hubUrl: "" # WebSocket URL for the MCPx Hub service
  controllerToken: "" # Long, random shared secret

  imagePullSecrets: []
  # - name: "registry-credentials"

  # OIDC configuration for authentication
  oidc:
    issuerUrl: ""
    clientId: ""
    clientSecret: ""
    sessionSecret: ""

  redis:
    # If true, deploy a Redis instance within this chart and avoid using the url field
    # If deploy is true, the isCluster field should be set to false.
    deploy: false
    isCluster: true
    prefix: "mcpx-hive"
    url: ""

router:
  replicaCount: 2

ingress:
  enabled: true
  annotations: {}

  # --- Cloud Provider Configuration ---
  # Configure ONE of the following cloud providers by providing its object
  # The presence of the object determines which cloud provider to use

  # aws:
  #   loadBalancerType: "" # Options: nlb, alb
  #   loadBalancerName: "" # Custom name for the ALB
  #   securityGroups: [] # EKS cluster security group
  #   subnets: []
  #   certificateArn: "" # ACM certificate ARN for TLS termination

  # gcp:
  #   staticIPName: "" # Optional unified static IP name for GCP

  # azure:
  #   applicationGatewayName: "" # Name of the Application Gateway
  #   resourceGroup: "" # Resource group containing the Application Gateway
  #   subscriptionId: "" # Azure subscription ID
  #   staticIP: "" # Static public IP address for Azure Application Gateway
