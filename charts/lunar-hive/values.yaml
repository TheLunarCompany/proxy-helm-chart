# MCPx Hive Helm Chart Values

# --- Domain Configuration ---
domain: "lunar.dev"
controller_domain: &controller_domain "controller.local"
ui_domain: &ui_domain "ui.local"
router_domain: &router_domain "router.local"

global:
  imagePullSecrets:
    - name: lunar-private-mcpx-registry

crds:
  enabled: true

hiveController:
  image:
    repository: "us-central1-docker.pkg.dev/prj-common-442813/lunar-private/mcpx-hive-controller"
    tag: "b223d43"
    pullPolicy: "IfNotPresent"

  replicaCount: 1

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  service:
    enabled: true
    # In GCP it was ClusterIP, but in AWS it must be NodePort
    type: "NodePort"
    port: 80
    targetPort: 8080

  serviceAccount:
    create: true
    annotations: {}
    name: ""

  rbac:
    create: true

  autoscaling:
    enabled: false

  env:
    PORT: 8080
    LOG_LEVEL: info
    MCPX_API_VERSION: hive.lunar.dev/v1alpha1
    MCPX_KIND: MCPx
    ROUTER_DOMAIN: "" # Will be set from .Values.router_domain in deployment template

  # Optional: name/key of a secret containing the controller API token
  controllerTokenSecret:
    name: "" # e.g. mcpx-controller-token
    key: token

  # Health check probes
  probes:
    livenessProbe:
      httpGet:
        path: /health/live
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 10
    readinessProbe:
      httpGet:
        path: /health/ready
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000

  podSecurityContext:
    fsGroup: 2000
    runAsNonRoot: true
    runAsUser: 1000

  affinity: {}
  tolerations: []
  nodeSelector: {}

# Router deployment & service configuration
router:
  enabled: true
  replicaCount: 1
  image:
    repository: "openresty/openresty"
    tag: "1.27.1.2-4-alpine-fat"
    pullPolicy: "IfNotPresent"
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    name: "mcpx-hive-router"
    # In GCP it was ClusterIP, but in AWS it must be NodePort
    type: NodePort
    ports:
      - name: ui
        port: 5173
        targetPort: 5173
      - name: mcpx-server
        port: 9000
        targetPort: 9000
      - name: metrics
        port: 3000
        targetPort: 3000

  # OIDC configuration for authentication
  oidc:
    issuerUrl: ""
    clientId: ""
    clientSecret: ""
    sessionSecret: "dev-session-secret-change-in-production"

  # Redis configuration for instance ID lookup
  redis:
    isCluster: true
    url: ""

ingress:
  enabled: true
  domains:
    controller:
      - host: *controller_domain
        paths:
          - path: /
            pathType: Prefix
            backend:
              serviceName: "controller"
              servicePort: 80
    router:
      - host: *router_domain
        paths:
          - path: /
            pathType: Prefix
            backend:
              serviceName: "router"
              servicePort: 9000
    ui:
      - host: *ui_domain
        paths:
          - path: /
            pathType: Prefix
            backend:
              serviceName: "router"
              servicePort: 5173
  annotations: {}
  # Additional annotations can be added here
  # key: value

  # --- Cloud Provider Configuration ---
  # Configure ONE of the following cloud providers by providing its object
  # The presence of the object determines which cloud provider to use

  gcp:
    # GCP-specific configuration
    staticIPName: "" # Optional unified static IP name for GCP


  # aws:
  #   # AWS-specific configuration
  #   loadBalancerType: "" # Options: nlb, alb
  #   loadBalancerName: "" # Custom name for the ALB
  #   securityGroups: [] # EKS cluster security group
  #   subnets: []
  #   certificateArn: "" # ACM certificate ARN for TLS termination

  # azure:
  #   # Azure-specific configuration (uncomment and configure for Azure)
  #   applicationGatewayName: "" # Name of the Application Gateway
  #   resourceGroup: "" # Resource group containing the Application Gateway
  #   subscriptionId: "" # Azure subscription ID
  #   staticIP: "" # Static public IP address for Azure Application Gateway
