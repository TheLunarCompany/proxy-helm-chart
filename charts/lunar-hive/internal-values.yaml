# Internal defaults for controller, router, Redis, and CRDs. Override via values files only when necessary.

crds:
  enabled: true

redis:
  image:
    repository: "redis"
    tag: "7.2-alpine"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""

mcpxUi:
  enabled: true
  replicaCount: 1
  image:
    repository: "us-central1-docker.pkg.dev/prj-common-442813/mcpx/mcpx-ui"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  containerPort: 5173
  resources:
    limits:
      cpu: 150m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    name: "mcpx-ui"
    type: ClusterIP
    ports:
      - name: ui
        port: 80
        targetPort: 5173
  env:
    VITE_ENABLE_ENTERPRISE: "true"

  nodeSelector: {}
  tolerations: []
  affinity: {}

router:
  enabled: true
  replicaCount: 1
  uiTargetPort: 5173
  mcpxTargetPort: 9000
  image:
    repository: "us-central1-docker.pkg.dev/prj-common-442813/lunar-private/mcpx-hive-router"
    tag: "lkjaaa"
    pullPolicy: "IfNotPresent"
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    name: "mcpx-hive-router"
    type: NodePort
    ports:
      - name: ui
        port: 5173
        targetPort: 5173
      - name: mcpx-server
        port: 9000
        targetPort: 9000
      - name: metrics
        port: 3000
        targetPort: 3000
  nodeSelector: {}
  tolerations: []
  affinity: {}

hiveController:
  controllerToken: ""
  image:
    repository: "us-central1-docker.pkg.dev/prj-common-442813/lunar-private/mcpx-hive-controller"
    tag: "lkj"
    pullPolicy: "IfNotPresent"
  replicaCount: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    enabled: true
    type: "NodePort"
    port: 80
    targetPort: 8080
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  rbac:
    create: true
  autoscaling:
    enabled: false
  env:
    PORT: 8080
    MCPX_API_VERSION: hive.lunar.dev/v1alpha1
    MCPX_KIND: MCPx
    ROUTER_DOMAIN: ""
  probes:
    livenessProbe:
      httpGet:
        path: /health/live
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 10
    readinessProbe:
      httpGet:
        path: /health/ready
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  podSecurityContext:
    fsGroup: 2000
    runAsNonRoot: true
    runAsUser: 1000
  affinity: {}
  tolerations: []
  nodeSelector: {}
