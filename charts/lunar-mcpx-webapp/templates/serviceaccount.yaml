{{/*
Permissionless ServiceAccount shared by all app deployments and cronjobs, so
pods never fall back to the namespace default ServiceAccount. Annotations are
settable from values for future cloud IAM needs (e.g. EKS IRSA).
The hive-controller keeps its own RBAC-bound ServiceAccount.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lunar-mcpx-webapp.fullname" . }}
  labels:
    {{- include "lunar-mcpx-webapp.labels" . | nindent 4 }}
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.global.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
