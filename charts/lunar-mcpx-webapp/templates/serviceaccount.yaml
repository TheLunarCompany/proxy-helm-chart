{{- if .Values.global.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default (include "lunar-mcpx-webapp.fullname" .) .Values.global.serviceAccount.name }}
  labels:
    {{- include "lunar-mcpx-webapp.labels" . | nindent 4 }}
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.global.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- range $key, $svc := dict "webserver" .Values.webserver "hub" .Values.hub "admin" .Values.admin "auth" .Values.auth "router" .Values.router "ui" .Values.ui "jobs" .Values.jobs }}
{{- $sa := $svc.serviceAccount | default dict }}
{{- if $sa.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lunar-mcpx-webapp.serviceAccountName" (dict "root" $ "svc" $svc "key" $key) }}
  labels:
    {{- include "lunar-mcpx-webapp.labels" $ | nindent 4 }}
    {{- with $.Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
