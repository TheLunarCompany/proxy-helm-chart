{{- $gatewayHubEnabled := .Values.gatewayHub.enabled | default false }}
{{- $gatewayEnabled := .Values.gateway.enabled | default false }}
{{/* No `| default true`: Helm's default() treats false as empty, which would
make gateway.hub.enabled=false unsettable. */}}
{{- $gatewayDialsHub := and $gatewayEnabled .Values.gateway.hub.enabled }}
{{- if or $gatewayHubEnabled $gatewayDialsHub }}
{{- if not .Values.gatewayHub.existingSecret.name }}
{{- if not .Values.gatewayHub.sharedSecret }}
{{- fail "gatewayHub.sharedSecret (or gatewayHub.existingSecret.name) is required when gatewayHub.enabled or gateway.enabled is true. A hub with no secret would accept every connection. Generate one with: openssl rand -hex 32" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lunar-mcpx-webapp.fullname" . }}-gateway-hub
  labels:
    name: {{ include "lunar-mcpx-webapp.fullname" . }}-gateway-hub
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
data:
  GATEWAY_HUB_SHARED_SECRET: {{ .Values.gatewayHub.sharedSecret | b64enc | quote }}
{{- end }}
{{- end }}
