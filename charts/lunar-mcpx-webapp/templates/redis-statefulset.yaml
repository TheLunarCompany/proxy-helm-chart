{{- if .Values.redis.enabled | default false }}
{{- $tolerations := concat .Values.global.tolerations .Values.redis.tolerations -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "lunar-mcpx-webapp.fullname" . }}-redis
  labels:
    name: {{ include "lunar-mcpx-webapp.fullname" . }}-redis
    app: {{ include "lunar-mcpx-webapp.fullname" . }}-redis
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.redis.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app: {{ include "lunar-mcpx-webapp.fullname" . }}-redis
      {{- include "lunar-mcpx-webapp.selectorLabels" . | nindent 6 }}
      {{- with .Values.global.labels }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.redis.labels }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.redis.podLabels }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
  serviceName: redis
  replicas: 1
  template:
    metadata:
      labels:
        app: {{ include "lunar-mcpx-webapp.fullname" . }}-redis
        {{- include "lunar-mcpx-webapp.selectorLabels" . | nindent 8 }}
        {{- with .Values.global.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.redis.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.redis.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: db
          image: redis:8.2-alpine
          command: []
          args:
            - redis-server
            - /etc/redis/redis.conf
          securityContext:
            allowPrivilegeEscalation: false
            {{- include "lunar-mcpx-webapp.restrictedSeccompAndCaps" . | nindent 12 }}
          resources:
            requests:
              memory: "1024Mi"
              cpu: "256m"
            limits:
              memory: "1024Mi"
              cpu: "256m"
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: conf
              mountPath: /etc/redis/
              readOnly: false
            {{- if .Values.redis.persistence.enabled | default false }}
            - name: data
              mountPath: /data
            {{- end }}
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            timeoutSeconds: 1
            periodSeconds: 5
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        {{- if not (.Capabilities.APIVersions.Has "security.openshift.io/v1") }}
        # redis:alpine runs as uid 999, gid 1000
        runAsUser: 999
        runAsGroup: 1000
        {{- end }}
      volumes:
        - name: conf
          configMap:
            name: {{ include "lunar-mcpx-webapp.fullname" . }}-redis-config
            defaultMode: 0644
      {{- with .Values.redis.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.redis.persistence.enabled | default false }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        {{- if .Values.redis.persistence.accessModes }}
        accessModes: {{ .Values.redis.persistence.accessModes }}
        {{- else }}
        accessModes: [ "ReadWriteOnce" ]
        {{- end }}
        {{- if .Values.redis.persistence.storageClassName }}
        storageClassName: {{ .Values.redis.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.redis.persistence.size | default "5Gi" }}
  {{- end }}

{{- end }}
