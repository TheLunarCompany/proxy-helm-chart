{{- if .Values.controller.enabled | default true }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lunar-mcpx-webapp.fullname" . }}-controller
  annotations:
    {{- if .Values.ingress.enabled | default true }}
    {{- if eq .Values.ingress.type "gce" }}
    cloud.google.com/backend-config: '{"ports": {"controller80":"{{ include "lunar-mcpx-webapp.fullname" . }}-controller"}}'
    {{- end }}
    {{- end }}
spec:
  ports:
    - name: controller80
      protocol: TCP
      port: 80
      targetPort: 8080
  sessionAffinity: ClientIP
  type: ClusterIP
  selector:
    app: {{ include "lunar-mcpx-webapp.fullname" . }}-controller
    {{- include "lunar-mcpx-webapp.selectorLabels" . | nindent 4 }}


{{- if .Values.ingress.enabled | default true }}
{{- if eq .Values.ingress.type "gce" }}
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ include "lunar-mcpx-webapp.fullname" . }}-controller
spec:
  healthCheck:
    checkIntervalSec: 30
    timeoutSec: 10
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /health/live
    port: 8080
{{- end }}
{{- end }}

{{- end }}
