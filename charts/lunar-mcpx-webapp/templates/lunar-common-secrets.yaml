apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lunar-mcpx-webapp.resourceName" (dict "root" . "suffix" "embedded") }}
  labels:
    name: {{ include "lunar-mcpx-webapp.resourceName" (dict "root" . "suffix" "embedded") }}
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
data:
  {{- $postgresHost := include "lunar-mcpx-webapp.resourceName" (dict "root" . "suffix" "postgres") }}
  {{- $redisHost := include "lunar-mcpx-webapp.resourceName" (dict "root" . "suffix" "redis") }}
  {{- if .Values.postgres.enabled | default false }}
  {{- $postgres_username := .Values.postgres.credentials.username | default "postgres" }}
  {{- $postgres_password := .Values.postgres.credentials.password | default "postgres" }}
  {{- $postgres_database := .Values.postgres.credentials.database | default "mcpx" }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:5432/%s?schema=public" $postgres_username $postgres_password $postgresHost $postgres_database | b64enc | quote }}
  {{- end }}
  {{- if .Values.redis.enabled | default false }}
  REDIS_URL: {{ printf "redis://%s:6379" $redisHost | b64enc | quote }}
  REDIS_IS_CLUSTER: {{ "false" | b64enc | quote }}
  {{- end }}
  {{- if .Values.global.encryptionKey }}
  ENCRYPTION_KEY: {{ .Values.global.encryptionKey | b64enc | quote }}
  {{- end }}
