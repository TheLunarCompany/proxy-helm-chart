apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lunar-mcpx-webapp.fullname" . }}-embedded
  labels:
    name: {{ include "lunar-mcpx-webapp.fullname" . }}-embedded
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
data:
  {{- $xfullname := include "lunar-mcpx-webapp.fullname" . }}
  {{- if .Values.postgres.enabled | default false }}
  {{- $postgres_username := .Values.postgres.credentials.username | default "postgres" }}
  {{- $postgres_password := .Values.postgres.credentials.password | default "postgres" }}
  {{- $postgres_database := .Values.postgres.credentials.database | default "mcpx" }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s-postgres:5432/%s?schema=public" $postgres_username $postgres_password $xfullname $postgres_database | b64enc | quote }}
  {{- end }}
  {{- if .Values.redis.enabled | default false }}
  {{- $redis_is_cluster := "false" }}
  REDIS_URL: {{ printf "redis://%s-redis:6379" $xfullname | b64enc | quote }}
  # One fact under two names: the Node services read REDIS_IS_CLUSTER, the
  # ai-gateway's Go engine reads REDIS_USE_CLUSTER. Both come from the same
  # variable so they cannot drift.
  REDIS_IS_CLUSTER: {{ $redis_is_cluster | b64enc | quote }}
  REDIS_USE_CLUSTER: {{ $redis_is_cluster | b64enc | quote }}
  {{- end }}
  {{- if .Values.global.encryptionKey }}
  ENCRYPTION_KEY: {{ .Values.global.encryptionKey | b64enc | quote }}
  {{- end }}
