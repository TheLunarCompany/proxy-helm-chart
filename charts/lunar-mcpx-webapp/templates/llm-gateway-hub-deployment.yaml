{{- if .Values.llmGatewayHub.enabled }}
{{- $tolerations := concat .Values.global.tolerations .Values.llmGatewayHub.tolerations -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lunar-mcpx-webapp.fullname" . }}-llm-gateway-hub
  labels:
    name: {{ include "lunar-mcpx-webapp.fullname" . }}-llm-gateway-hub
    app: {{ include "lunar-mcpx-webapp.fullname" . }}-llm-gateway-hub
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.llmGatewayHub.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if not (include "lunar-mcpx-webapp.hpaEnabled" (dict "key" "llmGatewayHub" "context" .)) }}
  replicas: {{ .Values.llmGatewayHub.replicaCount | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ include "lunar-mcpx-webapp.fullname" . }}-llm-gateway-hub
      {{- include "lunar-mcpx-webapp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: {{ include "lunar-mcpx-webapp.fullname" . }}-llm-gateway-hub
        {{- include "lunar-mcpx-webapp.selectorLabels" . | nindent 8 }}
        {{- with .Values.global.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.llmGatewayHub.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.llmGatewayHub.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "lunar-mcpx-webapp.fullname" . }}
      {{- with concat (.Values.global.extraInitContainers | default (list)) (.Values.llmGatewayHub.extraInitContainers | default (list)) }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: llm-gateway-hub
          image: "{{ .Values.llmGatewayHub.image.repository }}:{{ .Values.llmGatewayHub.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.llmGatewayHub.image.pullPolicy }}
          ports:
            - containerPort: 3011
              name: http
          {{- if or (.Values.global.manageResources.limits) (.Values.global.manageResources.requests) }}
          resources:
            {{- if .Values.global.manageResources.limits }}
            limits:
              {{- toYaml .Values.llmGatewayHub.resources.limits | nindent 14 }}
            {{- end }}
            {{- if .Values.global.manageResources.requests }}
            requests:
              {{- toYaml .Values.llmGatewayHub.resources.requests | nindent 14 }}
            {{- end }}
          {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            {{- include "lunar-mcpx-webapp.restrictedSeccompAndCaps" . | nindent 12 }}
            runAsUser: 1000
            runAsGroup: 1000
          envFrom:
            - secretRef:
                name: {{ include "lunar-mcpx-webapp.fullname" . }}-embedded
            {{- range .Values.global.extraEnvFromSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
            {{- range .Values.llmGatewayHub.extraEnvFromSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          env:
            - name: PORT
              value: "3011"
            - name: LOG_LEVEL
              value: {{ .Values.llmGatewayHub.logLevel | quote }}
            - name: HUB_FIXTURES_DIR
              value: /etc/llm-gateway-hub/fixtures
            {{- if .Values.global.extraEnvVars }}
            {{- include "lunar-mcpx-webapp.tplvalues.render" (dict "value" .Values.global.extraEnvVars "context" $) | nindent 12 }}
            {{- end }}
            {{- if .Values.llmGatewayHub.extraEnvVars }}
            {{- include "lunar-mcpx-webapp.tplvalues.render" (dict "value" .Values.llmGatewayHub.extraEnvVars "context" $) | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 10
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: fixtures
              mountPath: /etc/llm-gateway-hub/fixtures
              readOnly: true
        {{- with concat (.Values.global.extraContainers | default (list)) (.Values.llmGatewayHub.extraContainers | default (list)) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: fixtures
          configMap:
            name: {{ .Values.llmGatewayHub.fixturesConfigMap | default (printf "%s-llm-gateway-hub-fixtures" (include "lunar-mcpx-webapp.fullname" .)) }}
      {{- with mergeOverwrite (deepCopy (.Values.global.affinity | default dict)) (.Values.llmGatewayHub.affinity | default dict) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with concat (.Values.global.topologySpreadConstraints | default list) (.Values.llmGatewayHub.topologySpreadConstraints | default list) }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with .Values.llmGatewayHub.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with coalesce .Values.llmGatewayHub.priorityClassName .Values.global.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
{{- end }}
