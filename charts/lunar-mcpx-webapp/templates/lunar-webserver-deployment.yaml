{{- if .Values.webserver.enabled | default true }}
{{- $tolerations := concat .Values.global.tolerations .Values.webserver.tolerations -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lunar-mcpx-webapp.fullname" . }}-webserver
  labels:
    name: {{ include "lunar-mcpx-webapp.fullname" . }}-webserver
    app: {{ include "lunar-mcpx-webapp.fullname" . }}-webserver
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.webserver.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.webserver.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ include "lunar-mcpx-webapp.fullname" . }}-webserver
      {{- include "lunar-mcpx-webapp.selectorLabels" . | nindent 6 }}
      {{- with .Values.global.labels }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.webserver.labels }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.webserver.podLabels }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
  template:
    metadata:
      labels:
        app: {{ include "lunar-mcpx-webapp.fullname" . }}-webserver
        {{- include "lunar-mcpx-webapp.selectorLabels" . | nindent 8 }}
        {{- with .Values.global.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.webserver.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.webserver.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      initContainers:
        - name: mcpx-webserver-prisma-migration
          image: "{{ .Values.webserver.image.repository }}:{{ .Values.webserver.image.tag | default .Values.global.appVersion | default .Chart.AppVersion }}"
          {{- if or (.Values.global.manageResources.limits) (.Values.global.manageResources.requests) }}
          resources:
            {{- if .Values.global.manageResources.limits }}
            limits:
              {{- with .Values.webserver.resources.limits }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
            {{- end }}
            {{- if .Values.global.manageResources.requests }}
            requests:
              {{- with .Values.webserver.resources.requests }}
                {{- toYaml . | nindent 14 }}
                {{- end }}
            {{- end }}
          {{- end }}
          command: ["/bin/sh"]
          args: ["-c", "cd /mcpx-webapp && npx prisma migrate deploy;"]
          envFrom:
            - secretRef:
                name: {{ include "lunar-mcpx-webapp.fullname" . }}-embedded
          {{- with .Values.global.extraEnvFromSecrets }}
          {{- range $.Values.global.extraEnvFromSecrets }}
            - secretRef:
                name: {{ . }}
          {{- end }}
          {{- end }}
          {{- with .Values.webserver.extraEnvFromSecrets }}
          {{- range $.Values.webserver.extraEnvFromSecrets }}
            - secretRef:
                name: {{ . }}
          {{- end }}
          {{- end }}
          env:
            - name: NODE_ENV
              value: "production"
          {{- if .Values.global.extraEnvVars }}
          {{- include "lunar-mcpx-webapp.tplvalues.render" (dict "value" .Values.global.extraEnvVars "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.webserver.extraEnvVars }}
          {{- include "lunar-mcpx-webapp.tplvalues.render" (dict "value" .Values.webserver.extraEnvVars "context" $) | nindent 12 }}
          {{- end }}

        {{- if .Values.clickhouse.enabled }}
        - name: mcpx-webserver-clickhouse-migration
          image: "{{ .Values.webserver.image.repository }}:{{ .Values.webserver.image.tag | default .Values.global.appVersion | default .Chart.AppVersion }}"
          {{- if or (.Values.global.manageResources.limits) (.Values.global.manageResources.requests) }}
          resources:
            {{- if .Values.global.manageResources.limits }}
            limits:
              {{- with .Values.webserver.resources.limits }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
            {{- end }}
            {{- if .Values.global.manageResources.requests }}
            requests:
              {{- with .Values.webserver.resources.requests }}
                {{- toYaml . | nindent 14 }}
                {{- end }}
            {{- end }}
          {{- end }}
          command: ["/bin/sh"]
          args: ["-c", "cd /mcpx-webapp && CLICKHOUSE_URL='{{ include "lunar-mcpx-webapp.clickhouseUrl" . }}' node packages/toolkit-clickhouse/dist/bin/migrate.js"]
          envFrom:
            - secretRef:
                name: {{ .Values.clickhouse.credentialsSecret }}
          env:
            - name: NODE_ENV
              value: "production"
        {{- end }}
        {{- with concat (.Values.global.extraInitContainers | default (list)) (.Values.webserver.extraInitContainers | default (list)) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: mcpx-webserver-container
          image: "{{ .Values.webserver.image.repository }}:{{ .Values.webserver.image.tag | default .Values.global.appVersion | default .Chart.AppVersion }}"
          ports:
            - containerPort: 8080
          {{- if or (.Values.global.manageResources.limits) (.Values.global.manageResources.requests) }}
          resources:
            {{- if .Values.global.manageResources.limits }}
            limits:
              {{- with .Values.webserver.resources.limits }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
            {{- end }}
            {{- if .Values.global.manageResources.requests }}
            requests:
              {{- with .Values.webserver.resources.requests }}
                {{- toYaml . | nindent 14 }}
                {{- end }}
            {{- end }}
          {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            {{- if not ( .Capabilities.APIVersions.Has "security.openshift.io/v1")  }}
            runAsUser: 1000
            runAsGroup: 1000
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "lunar-mcpx-webapp.fullname" . }}-embedded
          {{- with .Values.global.extraEnvFromSecrets }}
          {{- range $.Values.global.extraEnvFromSecrets }}
            - secretRef:
                name: {{ . }}
          {{- end }}
          {{- end }}
          {{- with .Values.webserver.extraEnvFromSecrets }}
          {{- range $.Values.webserver.extraEnvFromSecrets }}
            - secretRef:
                name: {{ . }}
          {{- end }}
          {{- end }}
          {{- if .Values.clickhouse.enabled }}
            - secretRef:
                name: {{ .Values.clickhouse.credentialsSecret }}
          {{- end }}
          env:
            - name: NODE_ENV
              value: "production"
            {{- with .Values.global.caCerts }}
            {{- with .secretName }}
            - name: NODE_EXTRA_CA_CERTS
              value: /usr/local/share/ca-certificates/{{ . }}.crt
            {{- end }}
            {{- end }}
            - name: PORT
              value: "8080"
            {{- if .Values.clickhouse.enabled }}
            - name: CLICKHOUSE_URL
              value: "{{ include "lunar-mcpx-webapp.clickhouseUrl" . }}"
            {{- end }}
            - name: HIVE_CONTROLLER_URL
              value: "http://{{ include "lunar-mcpx-webapp.fullname" . }}-controller"
            {{- if .Values.router.enabled | default true }}
            - name: ROUTER_INTERNAL_URL
              value: "http://{{ include "lunar-mcpx-webapp.fullname" . }}-router:{{ .Values.router.internalPort | default 4000 }}"
            {{- end }}
            {{- if or .Values.hibernation.cronSchedule (gt (int .Values.hibernation.idleMinutes) 0) }}
            - name: HIBERNATION_ENABLED
              value: "true"
            {{- end }}
            {{- if gt (int .Values.hibernation.idleMinutes) 0 }}
            - name: HIBERNATION_IDLE_MINUTES
              value: {{ .Values.hibernation.idleMinutes | quote }}
            {{- end }}
            - name: WEBAPP_DEPLOYMENT_PREFIX
              value: {{ include "lunar-mcpx-webapp.fullname" . | quote }}
            {{- $webserverExtraEnvNames := list }}
            {{- range .Values.webserver.extraEnvVars }}
            {{- $webserverExtraEnvNames = append $webserverExtraEnvNames .name }}
            {{- end }}
            {{- if not (has "HIVE_DEFAULT_MCPX_IMAGE_REPO" $webserverExtraEnvNames) }}
            - name: HIVE_DEFAULT_MCPX_IMAGE_REPO
              value: 'us-central1-docker.pkg.dev/prj-common-442813/mcpx/mcpx-server'
            {{- end }}
            {{- if not (has "HIVE_DEFAULT_MCPX_IMAGE_TAG" $webserverExtraEnvNames) }}
            - name: HIVE_DEFAULT_MCPX_IMAGE_TAG
              value: {{ .Values.ui.image.tag | default (include "lunar-mcpx-webapp.mcpxVersion" .) }}
            {{- end }}
          {{- if .Values.ingress.enabled }}
            - name: CORS_ALLOWED_ORIGINS
              value: "https://{{ first .Values.ingress.domains.admin }},https://{{ first .Values.ingress.domains.ui }}"
            - name: PUBLIC_URL
              value: "https://{{ first .Values.ingress.domains.webserver }}"
          {{- end }}
          {{- with .Values.webserver.sandboxAnalysis }}
          {{- if .llmProvider }}
            - name: SANDBOX_ANALYSIS_LLM_PROVIDER
              value: {{ .llmProvider | quote }}
          {{- end }}
          {{- if .llmModel }}
            - name: SANDBOX_ANALYSIS_LLM_MODEL
              value: {{ .llmModel | quote }}
          {{- end }}
          {{- end }}
          
          {{- if .Values.global.extraEnvVars }}
          {{- include "lunar-mcpx-webapp.tplvalues.render" (dict "value" .Values.global.extraEnvVars "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.webserver.extraEnvVars }}
          {{- include "lunar-mcpx-webapp.tplvalues.render" (dict "value" .Values.webserver.extraEnvVars "context" $) | nindent 12 }}
          {{- end }}

          startupProbe:
            successThreshold: 1
            failureThreshold: 30
            httpGet:
              path: /healthcheck
              port: 8080
              scheme: HTTP
            periodSeconds: 10
          readinessProbe:
            successThreshold: 1
            failureThreshold: 3
            httpGet:
              path: /healthcheck
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            failureThreshold: 10
            httpGet:
              path: /healthcheck
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 30

          {{- with .Values.global.caCerts }}
          volumeMounts:
          {{- with .secretName }}
            - name: {{ . }}
              mountPath: "/usr/local/share/ca-certificates/"
              readOnly: true
          {{- end }}
          {{- end }}
        {{- with concat (.Values.global.extraContainers | default (list)) (.Values.webserver.extraContainers | default (list)) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with .Values.global.caCerts }}
        {{- with .secretName }}
        - name: {{ . }}
          secret:
            secretName: {{ . }}
            items:
              - key: ca.crt
                path: {{ . }}.crt
        {{- end }}
        {{- end }}
      {{- with mergeOverwrite (deepCopy (.Values.global.affinity | default dict)) (.Values.webserver.affinity | default dict) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with concat (.Values.global.topologySpreadConstraints | default list) (.Values.webserver.topologySpreadConstraints | default list) }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range $.Values.global.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with .Values.webserver.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with coalesce .Values.webserver.priorityClassName .Values.global.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
  {{- end }}
