{{- if .Values.llmGateway.enabled }}
{{- $tolerations := concat .Values.global.tolerations .Values.llmGateway.tolerations -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lunar-mcpx-webapp.fullname" . }}-llm-gateway
  labels:
    name: {{ include "lunar-mcpx-webapp.fullname" . }}-llm-gateway
    app: {{ include "lunar-mcpx-webapp.fullname" . }}-llm-gateway
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.llmGateway.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if not (include "lunar-mcpx-webapp.hpaEnabled" (dict "key" "llmGateway" "context" .)) }}
  replicas: {{ .Values.llmGateway.replicaCount | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ include "lunar-mcpx-webapp.fullname" . }}-llm-gateway
      {{- include "lunar-mcpx-webapp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: {{ include "lunar-mcpx-webapp.fullname" . }}-llm-gateway
        {{- include "lunar-mcpx-webapp.selectorLabels" . | nindent 8 }}
        {{- with .Values.global.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.llmGateway.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.llmGateway.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "lunar-mcpx-webapp.fullname" . }}
      {{- with concat (.Values.global.extraInitContainers | default (list)) (.Values.llmGateway.extraInitContainers | default (list)) }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: llm-gateway
          image: "{{ .Values.llmGateway.image.repository }}:{{ .Values.llmGateway.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.llmGateway.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          {{- if or (.Values.global.manageResources.limits) (.Values.global.manageResources.requests) }}
          resources:
            {{- if .Values.global.manageResources.limits }}
            limits:
              {{- toYaml .Values.llmGateway.resources.limits | nindent 14 }}
            {{- end }}
            {{- if .Values.global.manageResources.requests }}
            requests:
              {{- toYaml .Values.llmGateway.resources.requests | nindent 14 }}
            {{- end }}
          {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            {{- include "lunar-mcpx-webapp.restrictedSeccompAndCaps" . | nindent 12 }}
            runAsUser: 65532
            runAsGroup: 65532
          envFrom:
            - secretRef:
                name: {{ include "lunar-mcpx-webapp.fullname" . }}-embedded
            {{- range .Values.global.extraEnvFromSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
            {{- range .Values.llmGateway.extraEnvFromSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          env:
            - name: BIND_PORT
              value: "8000"
            {{- if or .Values.llmGateway.hubUrl .Values.llmGatewayHub.enabled }}
            - name: HUB_URL
              value: {{ .Values.llmGateway.hubUrl | default (printf "ws://%s-llm-gateway-hub:3011" (include "lunar-mcpx-webapp.fullname" .)) | quote }}
            {{- end }}
            - name: FLOWS_DIRECTORY
              value: /etc/llm-gateway/flows
            - name: PROCESSORS_DIRECTORY
              value: /etc/llm-gateway/processors
            {{- if .Values.global.extraEnvVars }}
            {{- include "lunar-mcpx-webapp.tplvalues.render" (dict "value" .Values.global.extraEnvVars "context" $) | nindent 12 }}
            {{- end }}
            {{- if .Values.llmGateway.extraEnvVars }}
            {{- include "lunar-mcpx-webapp.tplvalues.render" (dict "value" .Values.llmGateway.extraEnvVars "context" $) | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 10
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: flows
              mountPath: /etc/llm-gateway/flows
              readOnly: true
            - name: processors
              mountPath: /etc/llm-gateway/processors
              readOnly: true
        {{- with concat (.Values.global.extraContainers | default (list)) (.Values.llmGateway.extraContainers | default (list)) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: flows
          configMap:
            name: {{ .Values.llmGateway.flowsConfigMap | default (printf "%s-llm-gateway-flows" (include "lunar-mcpx-webapp.fullname" .)) }}
        - name: processors
          configMap:
            name: {{ .Values.llmGateway.processorsConfigMap | default (printf "%s-llm-gateway-processors" (include "lunar-mcpx-webapp.fullname" .)) }}
      {{- with mergeOverwrite (deepCopy (.Values.global.affinity | default dict)) (.Values.llmGateway.affinity | default dict) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with concat (.Values.global.topologySpreadConstraints | default list) (.Values.llmGateway.topologySpreadConstraints | default list) }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with .Values.llmGateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with coalesce .Values.llmGateway.priorityClassName .Values.global.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
{{- end }}
