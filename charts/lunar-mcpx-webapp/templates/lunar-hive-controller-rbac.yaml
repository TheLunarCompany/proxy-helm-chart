{{- if .Values.controller.enabled | default true }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lunar-mcpx-webapp.fullname" . }}-controller
  labels:
    name: {{ include "lunar-mcpx-webapp.fullname" . }}-controller
    app: {{ include "lunar-mcpx-webapp.fullname" . }}-controller
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.controller.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "lunar-mcpx-webapp.fullname" . }}-controller
  labels:
    name: {{ include "lunar-mcpx-webapp.fullname" . }}-controller
    app: {{ include "lunar-mcpx-webapp.fullname" . }}-controller
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.controller.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
rules:
  - apiGroups: ["hive.lunar.dev"]
    resources: ["mcpxs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Additional permissions for secret management
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "lunar-mcpx-webapp.fullname" . }}-controller
  labels:
    name: {{ include "lunar-mcpx-webapp.fullname" . }}-controller
    app: {{ include "lunar-mcpx-webapp.fullname" . }}-controller
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.controller.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "lunar-mcpx-webapp.fullname" . }}-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "lunar-mcpx-webapp.fullname" . }}-controller
    namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "lunar-mcpx-webapp.fullname" . }}-controller-{{ .Release.Namespace }}
  labels:
    name: {{ include "lunar-mcpx-webapp.fullname" . }}-controller
    app: {{ include "lunar-mcpx-webapp.fullname" . }}-controller
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.controller.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["mcpxs.hive.lunar.dev"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "lunar-mcpx-webapp.fullname" . }}-controller-{{ .Release.Namespace }}
  labels:
    name: {{ include "lunar-mcpx-webapp.fullname" . }}-controller
    app: {{ include "lunar-mcpx-webapp.fullname" . }}-controller
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.controller.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "lunar-mcpx-webapp.fullname" . }}-controller-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "lunar-mcpx-webapp.fullname" . }}-controller
    namespace: {{ .Release.Namespace }}

{{- end }}
