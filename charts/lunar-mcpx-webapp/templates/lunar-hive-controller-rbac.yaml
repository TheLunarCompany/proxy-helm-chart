{{- if .Values.controller.enabled | default true }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lunar-mcpx-webapp.resourceName" (dict "root" . "suffix" "controller") }}
  labels:
    name: {{ include "lunar-mcpx-webapp.resourceName" (dict "root" . "suffix" "controller") }}
    app: {{ include "lunar-mcpx-webapp.resourceName" (dict "root" . "suffix" "controller") }}
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.controller.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "lunar-mcpx-webapp.resourceName" (dict "root" . "suffix" "controller") }}
  labels:
    name: {{ include "lunar-mcpx-webapp.resourceName" (dict "root" . "suffix" "controller") }}
    app: {{ include "lunar-mcpx-webapp.resourceName" (dict "root" . "suffix" "controller") }}
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.controller.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
rules:
  - apiGroups: ["hive.lunar.dev"]
    resources: ["mcpxs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Additional permissions for secret management
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Permissions for listing pods and reading pod logs
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "lunar-mcpx-webapp.resourceName" (dict "root" . "suffix" "controller") }}
  labels:
    name: {{ include "lunar-mcpx-webapp.resourceName" (dict "root" . "suffix" "controller") }}
    app: {{ include "lunar-mcpx-webapp.resourceName" (dict "root" . "suffix" "controller") }}
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.controller.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "lunar-mcpx-webapp.resourceName" (dict "root" . "suffix" "controller") }}
subjects:
  - kind: ServiceAccount
    name: {{ include "lunar-mcpx-webapp.resourceName" (dict "root" . "suffix" "controller") }}
    namespace: {{ .Release.Namespace }}

{{- end }}
