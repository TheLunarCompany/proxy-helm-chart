{{- if .Values.admin.enabled | default true }}
{{- $tolerations := concat .Values.global.tolerations .Values.admin.tolerations -}}
{{- $repository := include "lunar-mcpx-webapp.webappImage" (dict "repo" .Values.admin.image.repository "context" .) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lunar-mcpx-webapp.fullname" . }}-admin
  labels:
    name: {{ include "lunar-mcpx-webapp.fullname" . }}-admin
    app: {{ include "lunar-mcpx-webapp.fullname" . }}-admin
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.admin.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.admin.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ include "lunar-mcpx-webapp.fullname" . }}-admin
      {{- include "lunar-mcpx-webapp.selectorLabels" . | nindent 6 }}
      {{- with .Values.global.labels }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.admin.labels }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.admin.podLabels }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
  template:
    metadata:
      labels:
        app: {{ include "lunar-mcpx-webapp.fullname" . }}-admin
        {{- include "lunar-mcpx-webapp.selectorLabels" . | nindent 8 }}
        {{- with .Values.global.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.admin.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.admin.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with concat (.Values.global.extraInitContainers | default (list)) (.Values.admin.extraInitContainers | default (list)) }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mcpx-admin-container
          image: "{{ $repository }}:{{ .Values.admin.image.tag | default .Values.global.appVersion | default .Chart.AppVersion }}"
          ports:
            - containerPort: 8080
          {{- if or (.Values.global.manageResources.limits) (.Values.global.manageResources.requests) }}
          resources:
            {{- if .Values.global.manageResources.limits }}
            limits:
              {{- with .Values.admin.resources.limits }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
            {{- end }}
            {{- if .Values.global.manageResources.requests }}
            requests:
              {{- with .Values.admin.resources.requests }}
                {{- toYaml . | nindent 14 }}
                {{- end }}
            {{- end }}
          {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            {{- if not (.Capabilities.APIVersions.Has "security.openshift.io/v1") }}
            runAsUser: 1000
            runAsGroup: 1000
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "lunar-mcpx-webapp.fullname" . }}-embedded
          {{- with .Values.global.extraEnvFromSecrets }}
          {{- range $.Values.global.extraEnvFromSecrets }}
            - secretRef:
                name: {{ . }}
          {{- end }}
          {{- end }}
          {{- with .Values.admin.extraEnvFromSecrets }}
          {{- range $.Values.admin.extraEnvFromSecrets }}
            - secretRef:
                name: {{ . }}
          {{- end }}
          {{- end }}
          env:
            - name: NODE_ENV
              value: "production"
            {{- with .Values.global.caCerts }}
            {{- with .secretName }}
            - name: NODE_EXTRA_CA_CERTS
              value: /usr/local/share/ca-certificates/{{ . }}.crt
            {{- end }}
            {{- end }}
            - name: PORT
              value: "8080"
          {{- if .Values.ingress.enabled }}
            - name: API_BASE_URL
              value: "https://{{ first .Values.ingress.domains.webserver }}"
            - name: AUTH_BFF_URL
              value: "https://{{ first .Values.ingress.domains.auth }}"
            - name: MCPX_UI_URL
              value: "https://{{ first .Values.ingress.domains.ui }}"
            {{- if .Values.ingress.domains.gateway }}
            # The address agents point their provider base URL at, shown in the
            # Admin UI's "How to use" panel next to the key they just generated.
            # Absent when no gateway domain is set: the panel then falls back to
            # deriving one from the Admin UI's own host, which is a guess.
            - name: LLM_GATEWAY_URL
              value: "https://{{ first .Values.ingress.domains.gateway }}"
            {{- end }}
          {{- end }}
          {{- if .Values.global.extraEnvVars }}
          {{- include "lunar-mcpx-webapp.tplvalues.render" (dict "value" .Values.global.extraEnvVars "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.admin.extraEnvVars }}
          {{- include "lunar-mcpx-webapp.tplvalues.render" (dict "value" .Values.admin.extraEnvVars "context" $) | nindent 12 }}
          {{- end }}

          startupProbe:
            successThreshold: 1
            failureThreshold: 30
            httpGet:
              path: /healthcheck
              port: 8080
              scheme: HTTP
            periodSeconds: 10
          readinessProbe:
            successThreshold: 1
            failureThreshold: 3
            httpGet:
              path: /healthcheck
              port: 8080
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthcheck
              port: 8080
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 10

          {{- with .Values.global.caCerts }}
          volumeMounts:
          {{- with .secretName }}
            - name: {{ . }}
              mountPath: "/usr/local/share/ca-certificates/"
              readOnly: true
          {{- end }}
          {{- end }}
        {{- with concat (.Values.global.extraContainers | default (list)) (.Values.admin.extraContainers | default (list)) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with .Values.global.caCerts }}
        {{- with .secretName }}
        - name: {{ . }}
          secret:
            secretName: {{ . }}
            items:
              - key: ca.crt
                path: {{ . }}.crt
        {{- end }}
        {{- end }}
      {{- with mergeOverwrite (deepCopy (.Values.global.affinity | default dict)) (.Values.admin.affinity | default dict) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with concat (.Values.global.topologySpreadConstraints | default list) (.Values.admin.topologySpreadConstraints | default list) }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range $.Values.global.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with .Values.admin.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with coalesce .Values.admin.priorityClassName .Values.global.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
  {{- end }}
