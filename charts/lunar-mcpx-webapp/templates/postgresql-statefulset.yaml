{{- if .Values.postgres.enabled | default false }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "lunar-mcpx-webapp.fullname" . }}-postgres
  labels:
    name: {{ include "lunar-mcpx-webapp.fullname" . }}-postgres
    app: {{ include "lunar-mcpx-webapp.fullname" . }}-postgres
spec:
  selector:
    matchLabels:
      app: {{ include "lunar-mcpx-webapp.fullname" . }}-postgres
      {{- include "lunar-mcpx-webapp.selectorLabels" . | nindent 6 }}
  serviceName: postgres
  replicas: 1
  template:
    metadata:
      labels:
        app: {{ include "lunar-mcpx-webapp.fullname" . }}-postgres
        {{- include "lunar-mcpx-webapp.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: db
          image: postgres:17.6
          envFrom:
            - secretRef:
                name: {{ include "lunar-mcpx-webapp.fullname" . }}-postgres-env
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata/17
          command: []
          resources:
            requests:
              memory: "2048Mi"
              cpu: "256m"
            limits:
              memory: "2048Mi"
              cpu: "256m"
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data/pgdata
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 5Gi

  {{- end }}



