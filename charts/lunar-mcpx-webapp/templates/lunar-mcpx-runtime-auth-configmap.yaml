{{- $runtimeAuth := .Values.controller.mcpxRuntimeAuth | default dict }}
{{- if and (.Values.controller.enabled | default true) (or $runtimeAuth.dockerConfigSecrets $runtimeAuth.npmrcSecrets $runtimeAuth.uvConfigSecrets $runtimeAuth.netrcSecrets) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lunar-mcpx-webapp.fullname" . }}-mcpx-runtime-auth
  labels:
    name: {{ include "lunar-mcpx-webapp.fullname" . }}-mcpx-runtime-auth
    app: {{ include "lunar-mcpx-webapp.fullname" . }}-mcpx-runtime-auth
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  prepare-runtime-auth.js: |
    'use strict';
    const fs = require('fs');
    const path = require('path');

    const INPUT_ROOT = '/var/lunar/runtime-auth-input';
    const OUTPUT_ROOT = '/lunar/.mcpx-runtime-auth';

    function listInputFiles(sourceDir, fileName) {
      const fullDir = path.join(INPUT_ROOT, sourceDir);
      if (!fs.existsSync(fullDir)) {
        return [];
      }

      return fs
        .readdirSync(fullDir)
        .sort()
        .map((entry) => path.join(fullDir, entry))
        .filter((entryPath) => fs.statSync(entryPath).isDirectory())
        .map((entryPath) => path.join(entryPath, fileName))
        .filter((entryPath) => fs.existsSync(entryPath));
    }

    function ensureOutputFile(filePath) {
      fs.mkdirSync(path.dirname(filePath), { recursive: true, mode: 0o700 });
    }

    function writePrivateFile(filePath, content) {
      ensureOutputFile(filePath);
      fs.writeFileSync(filePath, content);
      fs.chmodSync(filePath, 0o600);
    }

    function mergeDockerConfigs() {
      const files = listInputFiles('docker', 'dockerconfigjson');
      if (!files.length) {
        return;
      }

      const merged = { auths: {} };

      for (const filePath of files) {
        const config = JSON.parse(fs.readFileSync(filePath, 'utf8'));
        merged.auths = { ...(merged.auths ?? {}), ...(config.auths ?? {}) };

        if (config.credHelpers) {
          merged.credHelpers = {
            ...(merged.credHelpers ?? {}),
            ...config.credHelpers,
          };
        }

        if (config.credsStore) {
          merged.credsStore = config.credsStore;
        }
      }

      writePrivateFile(
        path.join(OUTPUT_ROOT, 'docker', 'config.json'),
        JSON.stringify(merged),
      );
    }

    function concatFiles(sourceDir, fileName, outputPath) {
      const files = listInputFiles(sourceDir, fileName);
      if (!files.length) {
        return;
      }

      const content = files
        .map((filePath) => fs.readFileSync(filePath, 'utf8').trimEnd())
        .join('\n')
        .concat('\n');

      writePrivateFile(path.join(OUTPUT_ROOT, outputPath), content);
    }

    mergeDockerConfigs();
    concatFiles('npm', 'npmrc', 'npm/.npmrc');
    concatFiles('uv', 'uv.toml', 'uv/uv.toml');
    concatFiles('netrc', 'netrc', 'netrc/.netrc');
{{- end }}
