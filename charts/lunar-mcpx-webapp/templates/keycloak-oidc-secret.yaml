{{- if .Values.keycloak.enabled | default false }}
{{- $xfullname := include "lunar-mcpx-webapp.fullname" . -}}
{{- $realm := .Values.keycloak.realm | default "mcpx" -}}
{{- $keycloakDomains := .Values.ingress.domains.keycloak | default list -}}
{{- $oidcIssuer := "" -}}
{{- if $keycloakDomains -}}
{{- $oidcIssuer = printf "https://%s/realms/%s" (first $keycloakDomains) $realm -}}
{{- else -}}
{{- $oidcIssuer = printf "http://%s-keycloak/realms/%s" $xfullname $realm -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $xfullname }}-keycloak-oidc
  labels:
    name: {{ $xfullname }}-keycloak-oidc
    app: {{ $xfullname }}-keycloak
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.keycloak.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  OIDC_CLIENT_ID: {{ .Values.keycloak.clientId | default "mcpx-webapp" | quote }}
  OIDC_CLIENT_SECRET: {{ required "keycloak.clientSecret must be set when keycloak.enabled=true" .Values.keycloak.clientSecret | quote }}
  OIDC_ISSUER: {{ $oidcIssuer | quote }}
  {{- if and .Values.ingress.enabled .Values.ingress.domains.auth }}
  OIDC_REDIRECT_URI: "https://{{ first .Values.ingress.domains.auth }}/callback"
  {{- end }}
  OIDC_ROLES_CLAIM: {{ .Values.keycloak.oidc.rolesClaim | default "roles" | quote }}
  OIDC_EMAIL_CLAIM: {{ .Values.keycloak.oidc.emailClaim | default "email" | quote }}
  OIDC_SCOPES: {{ .Values.keycloak.oidc.scopes | default "openid profile email" | quote }}
{{- end }}
