{{- if .Values.ingress.enabled | default true }}
{{- $xfullname := include "lunar-mcpx-webapp.fullname" . }}
{{- if eq .Values.ingress.type "gce" }}
{{- range $key, $value := .Values.ingress.domains }}
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: {{ printf "%s-%s" $xfullname $key }}
  labels:
    name: {{ printf "%s-%s" $xfullname $key }}
    app: {{ printf "%s-%s" $xfullname $key }}
spec:
  domains:
    {{- range $value }}
    - {{ . }}
    {{- end }}
{{- end }}

---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: {{ include "lunar-mcpx-webapp.fullname" . }}
spec:
  redirectToHttps:
    enabled: true
    responseCodeName: "302"
{{- end }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lunar-mcpx-webapp.fullname" . }}
  annotations:
    {{- if eq .Values.ingress.type "gce" }}
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/managed-certificates:
      {{- $newList := list -}}
      {{- range $key, $value := .Values.ingress.domains -}}
      {{- $newList = append $newList (printf "%s-%s" $xfullname $key) -}}
      {{- end }}
      {{ join "," $newList }}
    networking.gke.io/v1beta1.FrontendConfig: {{ include "lunar-mcpx-webapp.fullname" . }}
    {{- end }}
    {{- if .Values.ingress.annotations }}
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    {{- end }}
spec:
  rules:
    {{- range $key, $value := .Values.ingress.domains }}
    {{- range $value }}
    {{- if eq $key "ui" }}
    - host: {{ . }}
      http:
        paths:
          - backend:
              service:
                name: {{ $xfullname }}-router
                port:
                  number: 5173
            path: /
            pathType: Prefix
    {{ else }}
    - host: {{ . }}
      http:
        paths:
          - backend:
              service:
                name: {{ $xfullname }}-{{ $key }}
                port:
                  number: 80
            path: /
            pathType: Prefix
          {{- if eq $key "webserver" }}
          - backend:
              service:
                name: {{ $xfullname }}-{{ $key }}
                port:
                  number: 80
            path: /ui/v1
            pathType: Prefix
          {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}

  {{- end }}


