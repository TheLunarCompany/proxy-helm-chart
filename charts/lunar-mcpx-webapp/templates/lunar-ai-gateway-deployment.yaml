{{- if .Values.gateway.enabled | default false }}
{{- $tolerations := concat .Values.global.tolerations .Values.gateway.tolerations -}}
{{- $repository := include "lunar-mcpx-webapp.webappImage" (dict "repo" .Values.gateway.image.repository "context" .) -}}
{{- $image := printf "%s:%s" $repository (.Values.gateway.image.tag | default .Values.global.appVersion | default .Chart.AppVersion) -}}
{{- $configDir := "/etc/lunar-proxy" -}}
{{- $backupDir := "/etc/lunar-proxy-backup" -}}
{{- $dataDir := "/var/log/lunar-proxy" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lunar-mcpx-webapp.fullname" . }}-gateway
  labels:
    name: {{ include "lunar-mcpx-webapp.fullname" . }}-gateway
    app: {{ include "lunar-mcpx-webapp.fullname" . }}-gateway
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.gateway.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.gateway.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ include "lunar-mcpx-webapp.fullname" . }}-gateway
      {{- include "lunar-mcpx-webapp.selectorLabels" . | nindent 6 }}
      {{- with .Values.global.labels }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.gateway.labels }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.gateway.podLabels }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
  template:
    metadata:
      labels:
        app: {{ include "lunar-mcpx-webapp.fullname" . }}-gateway
        {{- include "lunar-mcpx-webapp.selectorLabels" . | nindent 8 }}
        {{- with .Values.global.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.gateway.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.gateway.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      initContainers:
        # The config directory has to be writable: gateway-hub delivers flows
        # and providers.yaml on the handshake and the gateway persists them
        # there (plus a backup) so they survive a restart. A bare image path
        # would be read-only under readOnlyRootFilesystem, so the image's own
        # config is copied into an emptyDir once, at startup. The chart supplies
        # no configuration of its own - everything here comes from the image or
        # from the hub.
        - name: mcpx-gateway-config-seed
          image: "{{ $image }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          {{- if or (.Values.global.manageResources.limits) (.Values.global.manageResources.requests) }}
          resources:
            {{- if .Values.global.manageResources.limits }}
            limits:
              {{- with .Values.gateway.resources.limits }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
            {{- end }}
            {{- if .Values.global.manageResources.requests }}
            requests:
              {{- with .Values.gateway.resources.requests }}
                {{- toYaml . | nindent 14 }}
                {{- end }}
            {{- end }}
          {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            {{- if not (.Capabilities.APIVersions.Has "security.openshift.io/v1") }}
            runAsUser: 1000
            runAsGroup: 1000
            {{- end }}
          command: ["/bin/sh"]
          args:
            - "-c"
            - |
              set -e
              # This container does NOT mount the emptyDir over {{ $configDir }},
              # so {{ $configDir }} here is still the image's own config - the
              # defaults the gateway ships with - and /config is the emptyDir the
              # main container will read and write. Copy once: a later restart
              # keeps whatever the hub delivered.
              if [ ! -f /config/.seeded ]; then
                if [ -d {{ $configDir }} ]; then
                  cp -a {{ $configDir }}/. /config/
                fi
                touch /config/.seeded
              fi
              mkdir -p /config/flows /config/processors /config/quotas
              # The metric manager builds an api_call_count collector
              # unconditionally and will not start without this file.
              [ -f {{ $dataDir }}/discovery-state.json ] || echo '{}' > {{ $dataDir }}/discovery-state.json
          volumeMounts:
            - name: gateway-config
              mountPath: /config
            - name: gateway-data
              mountPath: {{ $dataDir }}
        {{- with concat (.Values.global.extraInitContainers | default (list)) (.Values.gateway.extraInitContainers | default (list)) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: mcpx-gateway-container
          image: "{{ $image }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.bindPort }}
            - name: metrics
              containerPort: {{ .Values.gateway.metricsPort }}
            - name: admin
              containerPort: {{ .Values.gateway.adminPort }}
          {{- if or (.Values.global.manageResources.limits) (.Values.global.manageResources.requests) }}
          resources:
            {{- if .Values.global.manageResources.limits }}
            limits:
              {{- with .Values.gateway.resources.limits }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
            {{- end }}
            {{- if .Values.global.manageResources.requests }}
            requests:
              {{- with .Values.gateway.resources.requests }}
                {{- toYaml . | nindent 14 }}
                {{- end }}
            {{- end }}
          {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            {{- if not (.Capabilities.APIVersions.Has "security.openshift.io/v1") }}
            runAsUser: 1000
            runAsGroup: 1000
            {{- end }}
          envFrom:
            # Same source as every other service in this chart. REDIS_URL and
            # REDIS_USE_CLUSTER come from here.
            - secretRef:
                name: {{ include "lunar-mcpx-webapp.fullname" . }}-embedded
          {{- with .Values.global.extraEnvFromSecrets }}
          {{- range $.Values.global.extraEnvFromSecrets }}
            - secretRef:
                name: {{ . }}
          {{- end }}
          {{- end }}
          {{- with .Values.gateway.extraEnvFromSecrets }}
          {{- range $.Values.gateway.extraEnvFromSecrets }}
            - secretRef:
                name: {{ . }}
          {{- end }}
          {{- end }}
          env:
            # Panics without it.
            - name: TENANT_NAME
              value: {{ .Values.gateway.tenantName | default (include "lunar-mcpx-webapp.fullname" .) | quote }}
            # Identifies this pod to the hub, and is the default for
            # GATEWAY_HUB_GATEWAY_ID.
            - name: GATEWAY_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BIND_PORT
              value: {{ .Values.gateway.bindPort | quote }}
            # Prometheus scrape endpoint served by the engine at /metrics.
            - name: METRICS_LISTEN_PORT
              value: {{ .Values.gateway.metricsPort | quote }}
            # Admin server: /health (what the probes below hit) and /providers.
            - name: LLM_GATEWAY_ADMIN_PORT
              value: {{ .Values.gateway.adminPort | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.gateway.logLevel | quote }}
            - name: LUNAR_ENGINE_FAILSAFE_ENABLED
              value: {{ .Values.gateway.failsafeEnabled | quote }}
            # Every path below is read from its own env var with no fallback to
            # the config root, so leaving one unset does not degrade - it breaks
            # silently. LUNAR_PROXY_PROCESSORS_DIRECTORY unset means "no
            # processors directory found", and a delivered flow then loads no
            # processors at all.
            - name: LUNAR_PROXY_CONFIG_DIR
              value: {{ $configDir | quote }}
            - name: LUNAR_PROXY_CONFIG
              value: {{ printf "%s/gateway_config.yaml" $configDir | quote }}
            - name: LUNAR_PROXY_FLOW_DIRECTORY
              value: {{ printf "%s/flows" $configDir | quote }}
            - name: LUNAR_PROXY_PROCESSORS_DIRECTORY
              value: {{ printf "%s/processors" $configDir | quote }}
            - name: LUNAR_PROXY_QUOTAS_DIRECTORY
              value: {{ printf "%s/quotas" $configDir | quote }}
            - name: LUNAR_PROVIDERS_FILE
              value: {{ printf "%s/providers.yaml" $configDir | quote }}
            - name: LUNAR_PROXY_METRICS_CONFIG
              value: {{ printf "%s/metrics.yaml" $configDir | quote }}
            - name: LUNAR_PROXY_CONFIG_BACKUP_DIR
              value: {{ $backupDir | quote }}
            - name: DISCOVERY_STATE_LOCATION
              value: {{ printf "%s/discovery-state.json" $dataDir | quote }}
            {{/*
            Redis backs the quota counters and the processors' shared memory.
            With no REDIS_URL the engine falls back to in-memory state, which is
            correct at one replica and wrong above it: each pod would then count
            its own budget.
            */}}
            {{- include "lunar-mcpx-webapp.gatewayRedisEnv" . | nindent 12 }}
            {{/*
            No LUNAR_DEFAULT_UPSTREAM. The destination comes from the request:
            an absolute-form target, Forwarded, X-Forwarded-Host or x-lunar-host.
            */}}
            {{/* No `| default true`: Helm's default() treats false as empty,
            which would make gateway.hub.enabled=false unsettable. */}}
            {{- if .Values.gateway.hub.enabled }}
            - name: GATEWAY_HUB_ENABLED
              value: "true"
            # Port 80 on the Service maps to the hub's 8080. The path is fixed
            # by gateway-hub's WS_PATH.
            - name: GATEWAY_HUB_URL
              value: ws://{{ include "lunar-mcpx-webapp.fullname" . }}-gateway-hub/v1/gateway
            {{- with .Values.gateway.hub.queueSize }}
            - name: GATEWAY_HUB_QUEUE_SIZE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.gateway.hub.batchMaxSize }}
            - name: GATEWAY_HUB_BATCH_MAX_SIZE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.gateway.hub.flushIntervalMs }}
            - name: GATEWAY_HUB_FLUSH_INTERVAL_MS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.gateway.hub.heartbeatMs }}
            - name: GATEWAY_HUB_HEARTBEAT_MS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.gateway.hub.drainMs }}
            - name: GATEWAY_HUB_DRAIN_MS
              value: {{ . | quote }}
            {{- end }}
            {{- else }}
            - name: GATEWAY_HUB_ENABLED
              value: "false"
            {{- end }}
          {{- if .Values.global.extraEnvVars }}
          {{- include "lunar-mcpx-webapp.tplvalues.render" (dict "value" .Values.global.extraEnvVars "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.gateway.extraEnvVars }}
          {{- include "lunar-mcpx-webapp.tplvalues.render" (dict "value" .Values.gateway.extraEnvVars "context" $) | nindent 12 }}
          {{- end }}

          # The admin server, not the proxy port: the proxy port only answers a
          # real LLM request, and there is nothing safe to send it on a probe.
          startupProbe:
            successThreshold: 1
            failureThreshold: 30
            httpGet:
              path: /health
              port: admin
              scheme: HTTP
            periodSeconds: 10
          readinessProbe:
            successThreshold: 1
            failureThreshold: 3
            httpGet:
              path: /health
              port: admin
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: admin
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10

          volumeMounts:
            - name: gateway-config
              mountPath: {{ $configDir }}
            - name: gateway-backup
              mountPath: {{ $backupDir }}
            - name: gateway-data
              mountPath: {{ $dataDir }}
            - name: tmp
              mountPath: /tmp
            {{- with .Values.global.caCerts }}
            {{- with .secretName }}
            - name: {{ . }}
              mountPath: "/usr/local/share/ca-certificates/"
              readOnly: true
            {{- end }}
            {{- end }}
        {{- with concat (.Values.global.extraContainers | default (list)) (.Values.gateway.extraContainers | default (list)) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        # Writable: hub-delivered flows and providers.yaml land here.
        - name: gateway-config
          emptyDir: {}
        # Written before every delivery, so a half-applied config can be rolled back.
        - name: gateway-backup
          emptyDir: {}
        # discovery state, the engine's log file and the file exporter's output.
        - name: gateway-data
          emptyDir: {}
        {{- with .Values.global.caCerts }}
        {{- with .secretName }}
        - name: {{ . }}
          secret:
            secretName: {{ . }}
            items:
              - key: ca.crt
                path: {{ . }}.crt
        {{- end }}
        {{- end }}
      {{- with mergeOverwrite (deepCopy (.Values.global.affinity | default dict)) (.Values.gateway.affinity | default dict) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with concat (.Values.global.topologySpreadConstraints | default list) (.Values.gateway.topologySpreadConstraints | default list) }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range $.Values.global.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with coalesce .Values.gateway.priorityClassName .Values.global.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
  {{- end }}
