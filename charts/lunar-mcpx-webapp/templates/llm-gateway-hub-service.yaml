{{- if .Values.llmGatewayHub.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lunar-mcpx-webapp.fullname" . }}-llm-gateway-hub
  labels:
    name: {{ include "lunar-mcpx-webapp.fullname" . }}-llm-gateway-hub
    app: {{ include "lunar-mcpx-webapp.fullname" . }}-llm-gateway-hub
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.llmGatewayHub.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3011
      targetPort: http
      protocol: TCP
  selector:
    app: {{ include "lunar-mcpx-webapp.fullname" . }}-llm-gateway-hub
    {{- include "lunar-mcpx-webapp.selectorLabels" . | nindent 4 }}
{{- end }}
