{{- if .Values.auth.enabled | default true }}
{{- $tolerations := concat .Values.global.tolerations .Values.auth.tolerations -}}
{{- $repository := include "lunar-mcpx-webapp.webappImage" (dict "repo" .Values.auth.image.repository "context" .) -}}
{{- $globalCaSecretName := .Values.global.caCerts.secretName | default "" -}}
{{- $hasGlobalCaSecret := ne $globalCaSecretName "" -}}
{{- $googleCredentialsSecretName := .Values.auth.googleApplicationCredentials.secretName | default "" -}}
{{- $googleCredentialsSecretKey := .Values.auth.googleApplicationCredentials.secretKey | default "credentials.json" -}}
{{- $hasGoogleCredentialsSecret := ne $googleCredentialsSecretName "" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lunar-mcpx-webapp.fullname" . }}-auth
  labels:
    name: {{ include "lunar-mcpx-webapp.fullname" . }}-auth
    app: {{ include "lunar-mcpx-webapp.fullname" . }}-auth
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.auth.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.auth.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ include "lunar-mcpx-webapp.fullname" . }}-auth
      {{- include "lunar-mcpx-webapp.selectorLabels" . | nindent 6 }}
      {{- with .Values.global.labels }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.auth.labels }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.auth.podLabels }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
  template:
    metadata:
      labels:
        app: {{ include "lunar-mcpx-webapp.fullname" . }}-auth
        {{- include "lunar-mcpx-webapp.selectorLabels" . | nindent 8 }}
        {{- with .Values.global.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.auth.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.auth.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with include "lunar-mcpx-webapp.serviceAccountName" (dict "root" $ "svc" .Values.auth "key" "auth") }}
      serviceAccountName: {{ . }}
      {{- end }}
      initContainers:
        - name: mcpx-auth-prisma-migration
          image: "{{ $repository }}:{{ .Values.auth.image.tag | default .Values.global.appVersion | default .Chart.AppVersion }}"
          {{- if or (.Values.global.manageResources.limits) (.Values.global.manageResources.requests) }}
          resources:
            {{- if .Values.global.manageResources.limits }}
            limits:
              {{- with .Values.auth.resources.limits }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
            {{- end }}
            {{- if .Values.global.manageResources.requests }}
            requests:
              {{- with .Values.auth.resources.requests }}
                {{- toYaml . | nindent 14 }}
                {{- end }}
            {{- end }}
          {{- end }}
          command: ["/bin/sh"]
          args: ["-c", "cd /mcpx-webapp && npx prisma migrate deploy;"]
          envFrom:
            - secretRef:
                name: {{ include "lunar-mcpx-webapp.fullname" . }}-embedded
          {{- with .Values.global.extraEnvFromSecrets }}
          {{- range $.Values.global.extraEnvFromSecrets }}
            - secretRef:
                name: {{ . }}
          {{- end }}
          {{- end }}
          {{- with .Values.auth.extraEnvFromSecrets }}
          {{- range $.Values.auth.extraEnvFromSecrets }}
            - secretRef:
                name: {{ . }}
          {{- end }}
          {{- end }}
          env:
            - name: NODE_ENV
              value: "production"
          {{- if .Values.global.extraEnvVars }}
          {{- include "lunar-mcpx-webapp.tplvalues.render" (dict "value" .Values.global.extraEnvVars "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.auth.extraEnvVars }}
          {{- include "lunar-mcpx-webapp.tplvalues.render" (dict "value" .Values.auth.extraEnvVars "context" $) | nindent 12 }}
          {{- end }}
        {{- with concat (.Values.global.extraInitContainers | default (list)) (.Values.auth.extraInitContainers | default (list)) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: mcpx-auth-container
          image: "{{ $repository }}:{{ .Values.auth.image.tag | default .Values.global.appVersion | default .Chart.AppVersion }}"
          ports:
            - containerPort: 8080
          {{- if or (.Values.global.manageResources.limits) (.Values.global.manageResources.requests) }}
          resources:
            {{- if .Values.global.manageResources.limits }}
            limits:
              {{- with .Values.auth.resources.limits }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
            {{- end }}
            {{- if .Values.global.manageResources.requests }}
            requests:
              {{- with .Values.auth.resources.requests }}
                {{- toYaml . | nindent 14 }}
                {{- end }}
            {{- end }}
          {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            {{- if not (.Capabilities.APIVersions.Has "security.openshift.io/v1") }}
            runAsUser: 1000
            runAsGroup: 1000
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "lunar-mcpx-webapp.fullname" . }}-embedded
          {{- with .Values.global.extraEnvFromSecrets }}
          {{- range $.Values.global.extraEnvFromSecrets }}
            - secretRef:
                name: {{ . }}
          {{- end }}
          {{- end }}
          {{- with .Values.auth.extraEnvFromSecrets }}
          {{- range $.Values.auth.extraEnvFromSecrets }}
            - secretRef:
                name: {{ . }}
          {{- end }}
          {{- end }}
          env:
            - name: NODE_ENV
              value: "production"
            {{- if $hasGlobalCaSecret }}
            - name: NODE_EXTRA_CA_CERTS
              value: /usr/local/share/ca-certificates/{{ $globalCaSecretName }}.crt
            {{- end }}
            - name: PORT
              value: "8080"
            {{- include "lunar-mcpx-webapp.dbPoolEnv" .Values.auth | nindent 12 }}
            {{- if $hasGoogleCredentialsSecret }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/var/secrets/google/credentials.json"
            {{- end }}
          {{- if .Values.ingress.enabled }}
            - name: JWT_ISSUER
              value: "https://{{ first .Values.ingress.domains.auth }}"
            - name: CORS_ALLOWED_ORIGINS
              value: "https://{{ first .Values.ingress.domains.admin }},https://{{ first .Values.ingress.domains.ui }},https://{{ first .Values.ingress.domains.router }}"
          {{- end }}
          {{- if .Values.global.extraEnvVars }}
          {{- include "lunar-mcpx-webapp.tplvalues.render" (dict "value" .Values.global.extraEnvVars "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.auth.extraEnvVars }}
          {{- include "lunar-mcpx-webapp.tplvalues.render" (dict "value" .Values.auth.extraEnvVars "context" $) | nindent 12 }}
          {{- end }}

          startupProbe:
            successThreshold: 1
            failureThreshold: 30
            httpGet:
              path: /healthcheck
              port: 8080
              scheme: HTTP
            periodSeconds: 10
          readinessProbe:
            successThreshold: 1
            failureThreshold: 3
            httpGet:
              path: /healthcheck
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            failureThreshold: 10
            httpGet:
              path: /healthcheck
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 30

          {{- if or $hasGlobalCaSecret $hasGoogleCredentialsSecret }}
          volumeMounts:
          {{- if $hasGlobalCaSecret }}
            - name: {{ $globalCaSecretName }}
              mountPath: "/usr/local/share/ca-certificates/"
              readOnly: true
          {{- end }}
          {{- if $hasGoogleCredentialsSecret }}
            - name: google-application-credentials
              mountPath: "/var/secrets/google"
              readOnly: true
          {{- end }}
          {{- end }}
        {{- with concat (.Values.global.extraContainers | default (list)) (.Values.auth.extraContainers | default (list)) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $hasGlobalCaSecret }}
        - name: {{ $globalCaSecretName }}
          secret:
            secretName: {{ $globalCaSecretName }}
            items:
              - key: ca.crt
                path: {{ $globalCaSecretName }}.crt
        {{- end }}
        {{- if $hasGoogleCredentialsSecret }}
        - name: google-application-credentials
          secret:
            secretName: {{ $googleCredentialsSecretName }}
            items:
              - key: {{ $googleCredentialsSecretKey | quote }}
                path: "credentials.json"
        {{- end }}
      {{- with mergeOverwrite (deepCopy (.Values.global.affinity | default dict)) (.Values.auth.affinity | default dict) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with concat (.Values.global.topologySpreadConstraints | default list) (.Values.auth.topologySpreadConstraints | default list) }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range $.Values.global.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with .Values.auth.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with coalesce .Values.auth.priorityClassName .Values.global.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
  {{- end }}
