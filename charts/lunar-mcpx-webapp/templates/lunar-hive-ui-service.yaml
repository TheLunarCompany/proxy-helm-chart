{{- if .Values.ui.enabled | default true }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lunar-mcpx-webapp.fullname" . }}-ui
  annotations:
    {{- if .Values.ingress.enabled | default true }}
    {{- if eq .Values.ingress.type "gce" }}
    cloud.google.com/backend-config: '{"ports": {"ui80":"{{ include "lunar-mcpx-webapp.fullname" . }}-ui"}}'
    {{- end }}
    {{- end }}
spec:
  ports:
    - name: ui80
      protocol: TCP
      port: 80
      targetPort: 5173
  sessionAffinity: ClientIP
  type: ClusterIP
  selector:
    app: {{ include "lunar-mcpx-webapp.fullname" . }}-ui
    {{- include "lunar-mcpx-webapp.selectorLabels" . | nindent 4 }}


{{- if .Values.ingress.enabled | default true }}
{{- if eq .Values.ingress.type "gce" }}
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ include "lunar-mcpx-webapp.fullname" . }}-ui
spec:
  timeoutSec: 86400
  sessionAffinity:
    affinityType: "GENERATED_COOKIE"
    affinityCookieTtlSec: 86400
  healthCheck:
    checkIntervalSec: 30
    timeoutSec: 10
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /
    port: 5173
{{- end }}
{{- end }}

{{- end }}
