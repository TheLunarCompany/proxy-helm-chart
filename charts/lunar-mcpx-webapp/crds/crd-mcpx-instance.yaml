apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mcpxs.hive.lunar.dev
  labels:
    app: mcpx
    version: v1alpha1
spec:
  group: hive.lunar.dev
  names:
    kind: MCPx
    listKind: MCPxList
    plural: mcpxs
    singular: mcpx
    shortNames:
      - mcpx
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: "Defines the desired state of an MCPX all-in-one instance."
              properties:
                resources:
                  type: object
                  properties:
                    cpu:
                      type: string
                      pattern: '^([0-9]+m?|[0-9]+\.[0-9]+)$'
                    memory:
                      type: string
                      pattern: '^([0-9]+[KMGTPEZYkmgtpezy]i?|[0-9]+\.[0-9]+[KMGTPEZYkmgtpezy]i?)$'
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 10
                image:
                  type: string
                routerDomain:
                  type: string
                  description: "The domain for the router/API gateway."
                uiDomain:
                  type: string
                  description: "The domain for the user interface."
            configMapName:
              type: string
              description: "Name of the ConfigMap containing MCPX configurations."
              minLength: 1
            logLevel:
              type: string
              description: "Sets the log level for the MCPX instance."
              enum: ["debug", "info", "warn", "error"]
              default: "error"
            ports:
              type: object
              description: "Networking ports for the various services within the MCPX instance."
              properties:
                mcpx:
                  type: integer
                  description: "Port for the core MCPX server."
                  default: 9000
                metrics:
                  type: integer
                  description: "Port for serving Prometheus metrics."
                  default: 3000
            lunar:
              type: object
              description: "Configuration for Lunar Platform telemetry and interception."
              properties:
                telemetryEnabled:
                  type: boolean
                  description: "Enable or disable telemetry reporting to the Lunar Platform."
                  default: true
                consumerName:
                  type: string
                  description: "Identifier for this MCPX instance in Lunar telemetry."
                  default: "mcpx-anonymous"
                lunarUrl:
                  type: string
                  description: "The endpoint for the Lunar hosted gateway."
                  default: "https://hosted-gateway.lunar.dev"
                apiKeySecretRef:
                  type: object
                  description: "Reference to the secret containing the LUNAR_API_KEY."
                  required:
                    - name
                    - key
                  properties:
                    name:
                      type: string
                      description: "The name of the Kubernetes Secret."
                    key:
                      type: string
                      description: "The key within the Secret that holds the API key."
            status:
              type: object
              description: "Represents the observed state of the MCPX instance."
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                        description: "Type of condition (e.g., Ready, Progressing)."
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                        description: "Status of the condition."
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: "The last time the condition transitioned from one status to another."
                      reason:
                        type: string
                        description: "A unique, one-word, CamelCase reason for the condition's last transition."
                      message:
                        type: string
                        description: "A human-readable message indicating details about the transition."
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: Status
          type: string
          jsonPath: .status.conditions[?(@.type=='Ready')].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  conversion:
    strategy: None
