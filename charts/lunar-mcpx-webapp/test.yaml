---
global:
  # appVersion: 0.8.4
  # mcpxVersion: 0.3.23
  extraEnvVars:
    - name: LOG_LEVEL
      value: debug
    - name: SESSION_SECRET
      value: "Eq9AIhWdD0uxWVSv5pmtTPVipZt/c9Q6GZqnQNhX5BE="
    - name: SESSION_COOKIE_DOMAIN
      value: "lunar.dev"

hibernation:
  cronSchedule: "*/5 * * * *"

webserver:
  image:
    tag: 0.0.10-alpha.05
  # extraEnvFromSecrets:
  #   - mcpx-webapp-analysis-llm
  extraEnvVars:
    - name: ENABLE_AUTO_PROVISIONING
      value: "true"
    - name: MCPX_DEFAULT_IMAGE_REPO
      value: "us-central1-docker.pkg.dev/prj-common-442813/mcpx-dev/mcpx-server"
    - name: MCPX_DEFAULT_IMAGE_TAG
      value: "0.3.34-alpha.10"
    # - name: HIBERNATION_TIME
    #   value: "14:45"

admin:
  # image:
  #   tag: 0.0.10-alpha.06
  extraEnvVars:
    - name: SHOW_SUB_CATALOG
      value: "true"
    - name: SHOW_AGENTS_DEMO
      value: "true"

# hub:
#   replicaCount: 2

# router:
#   image:
#     tag: 0.0.10-alpha.01
#   replicaCount: 2

# controller:
#   image:
#     tag: 0.0.10-alpha.09
#   # replicaCount: 2
#   extraEnvVars:
#     - name: ENABLE_OAUTH_TOKEN_PERSISTENCE
#       value: "false"

ui:
  # replicaCount: 2
  extraEnvVars:
    - name: VITE_ENABLE_SAVED_SETUPS
      value: "true"
    - name: VITE_ENABLE_DYNAMIC_CAPABILITIES
      value: "true"
  image:
    tag: 0.3.34-alpha.10
    repository: us-central1-docker.pkg.dev/prj-common-442813/mcpx-dev/mcpx-ui

auth:
  # replicaCount: 2
  extraEnvFromSecrets:
    - mcpx-webapp-oidc

postgres:
  enabled: true

redis:
  enabled: true

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.global-static-ip-name: mcpx-hive
  type: gce

  domains:
    webserver:
      - mcpx-webserver-sandbox2.lunar.dev
    admin:
      - mcpx-admin-sandbox2.lunar.dev
    auth:
      - mcpx-auth-sandbox2.lunar.dev
    ui:
      - mcpx-ui-sandbox2.lunar.dev
    router:
      - mcpx-sandbox2.lunar.dev
