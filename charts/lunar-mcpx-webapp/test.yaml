---
global:
  extraEnvVars:
    - name: LOG_LEVEL
      value: debug
    - name: SESSION_SECRET
      value: "Eq9AIhWdD0uxWVSv5pmtTPVipZt/c9Q6GZqnQNhX5BE="
    - name: SESSION_COOKIE_DOMAIN
      value: "lunar.dev"
  # extraEnvFromSecrets:
  # - mcpx-webapp-global
  # 0.7.9-a0e5569
  appVersion: 0.7.9-27ca3b1
admin:
  extraEnvVars:
    - name: SHOW_RISK_DEMO
      value: "true"

auth:
  extraEnvFromSecrets:
    - mcpx-webapp-oidc

router:
  extraEnvFromSecrets:
    - mcpx-webapp-oidc

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.global-static-ip-name: mcpx-hive
  type: gce

  domains:
    webserver:
      - mcpx-webserver-sandbox2.lunar.dev
    admin:
      - mcpx-admin-sandbox2.lunar.dev
    auth:
      - mcpx-auth-sandbox2.lunar.dev
    ui:
      - mcpx-ui-sandbox2.lunar.dev
    router:
      - mcpx-sandbox2.lunar.dev

postgres:
  enabled: true

redis:
  enabled: true
