ingress:
  # -- Enable or disable Ingress for mcpx-webapp services
  enabled: true

  # -- ingressClassName
  ingressClassName: ""

  # -- Ingress annotations
  annotations: {}

  # Labels for all application related resources
  # labels:
  #   label_1: value_1
  #   label_2: value_2
  labels: {}

  domains:
    webserver:
      - mcpx-app.example.com
    admin:
      - mcpx-admin.example.com
    auth:
      - mcpx-auth.example.com
    ui:
      - mcpx-ui.example.com
    router:
      - mcpx.example.com

  # -- https variable controls settings related to certificates configuration on ingress
  # Block 'tls' represents standard 'tls' block of ingress controller - https://kubernetes.io/docs/concepts/services-networking/ingress/#tls
  # Note: 'tls' is optional for following types of ingress controller:
  #   nginx - tls configuration will be created, it will be referring secrets with patter tls-{{ domain name }}
  #   gce   - tls configuration will be empty and not required
  #
  # https:
  #   enabled: true
  #   tls:
  #    - hosts:
  #        - mcpx-app.example.com
  #      secretName: tls-mcpx-app.example.com
  https:
    enabled: true
    tls: []

  # -- Provision cloud-specific ingress resources and configuration.
  # Available options: "manual", "gce"
  # - undef  - deploys generic ingress without any cloud-specific configuration. Use ingress.annotations to configure it
  # - gce    - deploys GCP-specific resources, like ManagedCertificate, FrontendConfig, BackendConfig, etc
  type: undef

  # -- GCP-specific configuration. Used only when ingress.type = gce
  gce: {}

