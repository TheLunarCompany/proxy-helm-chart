## @section Global Section
global:
  ## @param global.imagePullSecrets [default:\[lunar-private-mcpx-registry] Global Docker registry secret names as an array
  # -- Global Docker registry secret names as an array
  # e.g.
  # imagePullSecrets:
  #   - lunar-private-mcpx-registry
  imagePullSecrets:
    - lunar-private-mcpx-registry

  # -- extraEnvVars An array to add extra env vars
  # e.g:
  # extraEnvVars:
  #   - name: FOO
  #     value: "bar"
  #   - name: FOO2
  #     valueFrom:
  #       secretKeyRef:
  #         name: SECRET_NAME
  #         key: KEY
  extraEnvVars: []

  # -- extraEnvFromSecrets An array of secret names to add as extra env vars
  # extraEnvFromSecrets:
  #   - secret_1
  #   - secret_2
  extraEnvFromSecrets: []

  # Labels for all resources
  # labels:
  #   label_1: value_1
  #   label_2: value_2
  labels: {}

webserver:
  image:
    # -- Lunar mcpx-webserver image repository
    repository: us-central1-docker.pkg.dev/prj-common-442813/lunar-private/mcpx-webserver
    # -- Lunar mcpx-webserver image pull policy
    pullPolicy: IfNotPresent
    # -- Lunar mcpx-webserver image tag
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""

  # -- NodeSelector to pin pods in deployment to certain set of nodes.
  # https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
  nodeSelector: {}

  # -- number of replicas to run
  replicaCount: 1

  # -- Set pod resource requests & limits
  resources:
    requests:
      memory: "128Mi"
      cpu: "150m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # -- extraEnvVars An array to add extra env vars
  # e.g:
  # extraEnvVars:
  #   - name: FOO
  #     value: "bar"
  #   - name: FOO2
  #     valueFrom:
  #       secretKeyRef:
  #         name: SECRET_NAME
  #         key: KEY
  extraEnvVars: []

  # -- extraEnvFromSecrets An array of secret names to add as extra env vars
  # extraEnvFromSecrets:
  #   - secret_1
  #   - secret_2
  extraEnvFromSecrets: []

  # Labels for all application related resources
  # labels:
  #   label_1: value_1
  #   label_2: value_2
  labels: {}

  # Pod Labels
  # labels:
  #   label_1: value_1
  #   label_2: value_2
  podLabels: {}

