controller:
  image:
    # -- Lunar mcpx-hive-controller image repository
    repository: us-central1-docker.pkg.dev/prj-common-442813/lunar-private/mcpx-hive-controller
    # -- Lunar mcpx-hive-controller image pull policy
    pullPolicy: IfNotPresent
    # -- Lunar mcpx-hive-controller image tag
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""

  # -- mcpxDockerRegistrySecrets List of docker-registry secret names used for
  # runtime Docker pulls inside every MCPX instance pod created by the controller.
  # Ops must pre-create these secrets in the MCPX namespace before referencing them here.
  # e.g.
  # mcpxDockerRegistrySecrets:
  #   - customer-private-registry-secret
  mcpxDockerRegistrySecrets: []

  # -- mcpxCRD configuration for CRD schema version checks
  mcpxCRD:
    # -- Enable strict schema version checking
    schemaVersionStrictCheck: true
    # -- Expected CRD schema version
    schemaExpectedVersion: "1"

  # -- NodeSelector to pin pods in deployment to certain set of nodes.
  # https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
  nodeSelector: {}

  # -- number of replicas to run
  replicaCount: 1

  # -- Set pod resource requests & limits
  resources:
    limits:
      cpu: "200m"
      memory: 256Mi
    requests:
      cpu: "100m"
      memory: 128Mi

  # -- extraEnvVars An array to add extra env vars
  # e.g:
  # extraEnvVars:
  #   - name: FOO
  #     value: "bar"
  #   - name: FOO2
  #     valueFrom:
  #       secretKeyRef:
  #         name: SECRET_NAME
  #         key: KEY
  extraEnvVars: []

  # -- extraEnvFromSecrets An array of secret names to add as extra env vars
