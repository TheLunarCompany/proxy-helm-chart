ingress:
  # -- Enable or disable Ingress for mcpx-webapp services
  enabled: true

  # -- Ingress annotations
  annotations: {}

  # Labels for all application related resources
  # labels:
  #   label_1: value_1
  #   label_2: value_2
  labels: {}

  domains:
    webserver:
      - mcpx-app.example.com
    admin:
      - mcpx-admin.example.com
    auth:
      - mcpx-auth.example.com
    ui:
      - mcpx-ui.example.com
    router:
      - mcpx.example.com

  https:
    enabled: true

  # -- Provision cloud-specific ingress resources and configuration.
  # Available options: "manual", "gce"
  # - undef  - deploys generic ingress without any cloud-specific configuration. Use ingress.annotations to configure it
  # - gce    - deploys GCP-specific resources, like ManagedCertificate, FrontendConfig, BackendConfig, etc
  type: undef

  # -- GCP-specific configuration. Used only when ingress.type = gce
  gce: {}

postgres:
  # -- Enable or disable embedded Postgresql StatefulSet
  # Warning: Do not use embedded Postgresql for production environments.
  # The purpose of embedded services is to provide a 'quick-start' option and for testing purposes.
  enabled: false

  # Labels for all application related resources
  # labels:
  #   label_1: value_1
  #   label_2: value_2
  labels: {}

  # Pod Labels
  # labels:
  #   label_1: value_1
  #   label_2: value_2
  podLabels: {}

  # -- Configure persistent storage
  # e.g.
  # persistence:
  #   enabled: true
  #   type: sts
  #   storageClassName: "storageClassName"
  #   accessModes:
  #     - ReadWriteOnce
  #   size: 20Gi
  persistence:
    enabled: true

  credentials:
    username: postgres
    password: postgres
    database: mcpx

