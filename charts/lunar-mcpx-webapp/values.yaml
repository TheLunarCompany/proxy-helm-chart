## @section Global Section
global:
  ## @param global.imagePullSecrets [default:\[lunar-private-mcpx-registry] Global Docker registry secret names as an array
  # -- Global Docker registry secret names as an array
  # e.g.
  # imagePullSecrets:
  #   - lunar-private-mcpx-registry
  imagePullSecrets:
    - lunar-private-mcpx-registry

  # -- extraEnvVars An array to add extra env vars
  # e.g:
  # extraEnvVars:
  #   - name: FOO
  #     value: "bar"
  #   - name: FOO2
  #     valueFrom:
  #       secretKeyRef:
  #         name: SECRET_NAME
  #         key: KEY
  extraEnvVars: []

  # -- extraEnvFromSecrets An array of secret names to add as extra env vars
  # extraEnvFromSecrets:
  #   - secret_1
  #   - secret_2
  extraEnvFromSecrets: []

  # -- encryptionKey is a base64-encoded 32-byte AES-256-GCM key used to encrypt target server
  # initiation data at rest. Used by hub, webserver, and any service that clones or reads setups.
  # Generate with: openssl rand -base64 32
  # Required — services that touch encrypted target servers will fail if this is not set.
  encryptionKey: ""

  # -- tolerations allow the scheduler to schedule pods with matching taints.
  # https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
  # tolerations:
  #   - key: "example-key"
  #     operator: "Exists"
  #     effect: "NoSchedule"
  tolerations: []

  # -- affinity is a scheduling feature that lets influence which nodes or which pods a pod should be placed near (or away from).
  # https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
  # affinity:
  #   podAntiAffinity:
  #     requiredDuringSchedulingIgnoredDuringExecution:
  #       - topologyKey: kubernetes.io/hostname
  #         labelSelector:
  #           matchLabels:
  #             example: lunar-mcpx-webapp
  affinity: {}

  # -- topologySpreadConstraints if specified, the pod's topology spread constraints.
  # https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
  # topologySpreadConstraints:
  #   - maxSkew: 1
  #     topologyKey: topology.kubernetes.io/zone
  #     whenUnsatisfiable: ScheduleAnyway
  #     labelSelector:
  #       matchLabels:
  #         example: lunar-mcpx-webapp
  topologySpreadConstraints: []

  # Labels for all resources
  # labels:
  #   label_1: value_1
  #   label_2: value_2
  labels: {}

  # -- Override for MCPX image tag across components. Falls back to the chart mcpxVersion annotation then appVersion.
  mcpxVersion: ""

  # -- manageResources flags that globally enables or disables resource specs
  # It is highly recommended to always specify requests and limits for services
  manageResources:
    limits: true
    requests: true

  # -- caCerts allows to configure additional Certificate Authorities (CA) from Kubernetes secrets
  # In case of multiple private CAs should be trusted, make sure to concat all of them in to the same file
  # caCerts:
  #   secretName: ca-private-cert-1
  caCerts: {}

  # -- extraInitContainers Additional init containers configuration
  # Value of this extraInitContainers will be appended to spec.template.spec.initContainers of the deployment
  extraInitContainers: []

  # -- extraContainers Additional sidecars configuration
  # Value of this extraContainers will be appended to spec.template.spec.containers of the deployment
  extraContainers: []

  # -- priorityClassName determines a pod's scheduling priority relative to other pods.
  # https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/#priorityclass
  # priorityClassName: "custom"
  priorityClassName: ""

webserver:
