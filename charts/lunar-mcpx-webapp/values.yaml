controller:
  image:
    # -- Lunar mcpx-hive-controller image repository
    repository: us-central1-docker.pkg.dev/prj-common-442813/lunar-private/mcpx-hive-controller
    # -- Lunar mcpx-hive-controller image pull policy
    pullPolicy: IfNotPresent
    # -- Lunar mcpx-hive-controller image tag
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""

  # -- mcpxRuntimeAuth injects runtime auth/config files into each MCPX instance pod
  # created by the controller. Referenced secrets must already exist in the MCPX namespace.
  mcpxRuntimeAuth:
    # -- dockerConfigSecret Name of a kubernetes.io/dockerconfigjson secret exposed to
    # Docker-based MCP servers inside MCPX via DOCKER_CONFIG.
    dockerConfigSecret: ""
    # -- fsGroup Group ID used to read mounted MCPX runtime auth secrets.
    # Defaults to the current Lunar MCPX image group.
    fsGroup: 1002
    # -- npmrcSecret Name of a secret containing a `.npmrc` key exposed to npm/npx
    # via NPM_CONFIG_USERCONFIG.
    npmrcSecret: ""
    # -- uvConfigSecret Name of a secret containing a `uv.toml` key exposed to uv/uvx
    # via UV_CONFIG_FILE.
    uvConfigSecret: ""
    # -- netrcSecret Name of a secret containing a `.netrc` key exposed via NETRC.
    netrcSecret: ""
    # -- decodeBase64 If true, runtime-auth secret values are expected to be base64-encoded and decoded at pod startup via an init container.
    decodeBase64: false

  # -- mcpxNodeSelector NodeSelector applied to every MCPX instance pod created by the controller.
  # Useful to constrain MCPX workloads to dedicated node pools (e.g. GPU nodes, spot nodes).
  # https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
  # mcpxNodeSelector:
  #   cloud.google.com/gke-nodepool: mcpx-pool
  mcpxNodeSelector: {}

  # -- mcpxTolerations Tolerations applied to every MCPX instance pod created by the controller.
  # Must match taints on the target nodes when mcpxNodeSelector targets tainted node pools.
  # https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
  # mcpxTolerations:
  #   - key: "dedicated"
  #     operator: "Equal"
  #     value: "mcpx"
  #     effect: "NoSchedule"
  mcpxTolerations: []

  # -- mcpxExtraInitContainers Additional init containers configuration applied to every MCPX instance pod created by the controller.
  # Value of this extraInitContainers will be appended to spec.template.spec.initContainers of the deployment
  mcpxExtraInitContainers: []

  # -- mcpxExtraContainers Additional sidecars configuration applied to every MCPX instance pod created by the controller.
  # Value of this extraContainers will be appended to spec.template.spec.containers of the deployment
  mcpxExtraContainers: []
  # -- mcpxAffinity Affinity applied to every MCPX instance pod created by the controller.
  # https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
  # mcpxAffinity:
  #   podAntiAffinity:
  #     requiredDuringSchedulingIgnoredDuringExecution:
  #       - topologyKey: kubernetes.io/hostname
  #         labelSelector:
  #           matchLabels:
  #             type: mcpx-instance
  mcpxAffinity: {}

  # -- mcpxTopologySpreadConstraints Topology spread constraints applied to every MCPX instance pod created by the controller.
  # https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
  # mcpxTopologySpreadConstraints:
  #   - maxSkew: 1
  #     topologyKey: topology.kubernetes.io/zone
  #     whenUnsatisfiable: ScheduleAnyway
  #     labelSelector:
  #       matchLabels:
  #         type: mcpx-instance
  mcpxTopologySpreadConstraints: []

  # -- mcpxPriorityClassName priorityClassName applied to every MCPX instance pod created by the controller.
  # https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/#priorityclass
  # mcpxPriorityClassName: "custom"
  mcpxPriorityClassName: ""

  # -- mcpxCRD configuration for CRD schema version checks
  mcpxCRD:
    # -- Enable strict schema version checking
    schemaVersionStrictCheck: true
    # -- Expected CRD schema version
    schemaExpectedVersion: "1"

  # -- NodeSelector to pin pods in deployment to certain set of nodes.
  # https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
  nodeSelector: {}

  # -- tolerations allow the scheduler to schedule pods with matching taints.
  # https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
  # tolerations:
  #   - key: "example-key"
  #     operator: "Exists"
  #     effect: "NoSchedule"
  tolerations: []

  # -- affinity is a scheduling feature that lets influence which nodes or which pods a pod should be placed near (or away from).
  # https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
  # affinity:
  #   podAntiAffinity:
  #     requiredDuringSchedulingIgnoredDuringExecution:
  #       - topologyKey: kubernetes.io/hostname
  #         labelSelector:
  #           matchLabels:
  #             example: lunar-mcpx-webapp
  affinity: {}

  # -- topologySpreadConstraints if specified, the pod's topology spread constraints.
