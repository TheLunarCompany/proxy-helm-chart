  #         userVerificationUrl: https://github.com/login/device
  #
  # Example: Client credentials flow
  # staticOauth:
  #   mapping:
  #     api.example.com: my-provider
  #   providers:
  #     my-provider:
  #       authMethod: client_credentials
  #       credentials:
  #         clientId: "..."
  #         clientSecret: "..."
  #       scopes:
  #         - scope1
  #         - scope2
  #       tokenAuthMethod: client_secret_basic
