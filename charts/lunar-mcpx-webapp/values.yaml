clickhouse:
  # -- Enable embedded ClickHouse for event store analytics.
  # Requires a pre-existing K8s secret with CLICKHOUSE_USER and CLICKHOUSE_PASSWORD keys.
  enabled: false
  # -- Name of the K8s secret containing CLICKHOUSE_USER and CLICKHOUSE_PASSWORD
  credentialsSecret: ""
  image:
    # -- ClickHouse image repository
    repository: clickhouse/clickhouse-server
    # -- ClickHouse image tag
    tag: 24.8-alpine
    # -- ClickHouse image pull policy
    pullPolicy: IfNotPresent
  nodeSelector: {}
  tolerations: []
  labels: {}
  podLabels: {}
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    storageClassName: ""
    size: 10Gi
  # -- Caps ClickHouse's internal system-log tables, which otherwise grow with
  # server uptime (not with usage) and can fill the data volume. text_log mirrors
  # the server log you already ship to stdout/Loki, and the metric/trace logs
  # overlap the Prometheus monitor, so they're disabled by default. Mounted into
  # /etc/clickhouse-server/config.d/. Set to "" to keep ClickHouse defaults, or
  # replace with your own XML to keep some logs (e.g. a short TTL instead).
  systemLogConfig: |
    <clickhouse>
        <text_log remove="1"/>
        <trace_log remove="1"/>
        <metric_log remove="1"/>
        <asynchronous_metric_log remove="1"/>
    </clickhouse>
  # -- Resource defaults: CH docs recommend 4 CPU / 8Gi RAM as practical minimum.
  # Limits set to 2x requests for burst headroom.
  resources:
    requests:
      memory: "4096Mi"
      cpu: "4000m"
    limits:
      memory: "8192Mi"
      cpu: "8000m"

monitor:
  prometheus:
    # -- Enable or disable MPCX monitoring with Prometheus
    # Important: in order for this to work, make sure that Prometheus CRDs are installed,
    # specifically 'monitoring.coreos.com/v1' API should be available
    enabled: false

    # -- Extra labels for ServiceMonitor resource to be able to be discovered by 'Prometheus' resource
    # Optional when 'serviceMonitorSelector: {}'
    # labels:
    #   label_1: value_1
    #   label_2: value_2
    labels: {}
