suite: Paired mcpx version (HIVE_DEFAULT_MCPX_IMAGE_TAG)
templates:
  - templates/lunar-hub-deployment.yaml
  - templates/lunar-webserver-deployment.yaml

release:
  name: my-release

tests:
  - it: gives the hub the paired mcpx version
    template: templates/lunar-hub-deployment.yaml
    set:
      global.mcpxVersion: "9.9.9"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HIVE_DEFAULT_MCPX_IMAGE_TAG
            value: "9.9.9"

  - it: gives the webserver the same version as the hub
    template: templates/lunar-webserver-deployment.yaml
    set:
      global.mcpxVersion: "9.9.9"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HIVE_DEFAULT_MCPX_IMAGE_TAG
            value: "9.9.9"

  - it: follows ui.image.tag for the hub, like the webserver does
    template: templates/lunar-hub-deployment.yaml
    set:
      global.mcpxVersion: "9.9.9"
      ui.image.tag: "7.7.7"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HIVE_DEFAULT_MCPX_IMAGE_TAG
            value: "7.7.7"

  - it: lets hub.extraEnvVars pin its own version without a second default entry
    template: templates/lunar-hub-deployment.yaml
    set:
      global.mcpxVersion: "9.9.9"
      hub.extraEnvVars:
        - name: HIVE_DEFAULT_MCPX_IMAGE_TAG
          value: "pinned"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HIVE_DEFAULT_MCPX_IMAGE_TAG
            value: "pinned"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: HIVE_DEFAULT_MCPX_IMAGE_TAG
            value: "9.9.9"
