suite: Auth deployment
templates:
  - templates/lunar-auth-bff-deployment.yaml

tests:
  - it: should not render auth credential mounts by default
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].volumeMounts
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOOGLE_APPLICATION_CREDENTIALS

  - it: should render Google ADC secret mount when configured
    set:
      auth.googleApplicationCredentials.secretName: mcpx-webapp-oidc
      auth.googleApplicationCredentials.secretKey: credentials.json
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOOGLE_APPLICATION_CREDENTIALS
            value: /var/secrets/google/credentials.json
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: google-application-credentials
            mountPath: /var/secrets/google
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: google-application-credentials
            secret:
              secretName: mcpx-webapp-oidc
              items:
                - key: credentials.json
                  path: credentials.json

  - it: should still render CA mounts independently
    set:
      global.caCerts.secretName: ca-example-com-1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_EXTRA_CA_CERTS
            value: /usr/local/share/ca-certificates/ca-example-com-1.crt
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ca-example-com-1
            mountPath: /usr/local/share/ca-certificates/
            readOnly: true

  - it: takes chart-derived defaults first, so secrets and extraEnvVars override them
    set:
      auth.extraEnvFromSecrets: [auth-oidc]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - configMapRef:
                name: RELEASE-NAME-lunar-mcpx-webapp-auth-defaults
            - secretRef:
                name: RELEASE-NAME-lunar-mcpx-webapp-embedded
            - secretRef:
                name: auth-oidc
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_REDIRECT_URI
