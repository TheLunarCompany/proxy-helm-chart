suite: Encrypt Target Server Initiations Job
templates:
  - templates/lunar-admin-encrypt-initiations-cronjob.yaml

tests:
  - it: should be a suspended CronJob
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: spec.suspend
          value: true

  - it: should use the impossible Feb 31 schedule
    asserts:
      - equal:
          path: spec.schedule
          value: "0 0 31 2 *"

  - it: should run encrypt-target-server-initiations command
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command
          value: ["node", "dist/index.js", "encrypt-target-server-initiations"]
