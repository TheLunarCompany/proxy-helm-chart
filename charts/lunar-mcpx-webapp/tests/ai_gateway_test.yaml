suite: AI gateway deployment and service
templates:
  - templates/lunar-ai-gateway-deployment.yaml
  - templates/lunar-ai-gateway-service.yaml

set:
  gateway.enabled: true

tests:
  - it: should render nothing when disabled
    set:
      gateway.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should point at the in-cluster gateway-hub Service by default
    template: templates/lunar-ai-gateway-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GATEWAY_HUB_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GATEWAY_HUB_URL
            value: "ws://RELEASE-NAME-lunar-mcpx-webapp-gateway-hub/v1/gateway"

  - it: should send no hub env beyond the off switch when the hub connection is disabled
    template: templates/lunar-ai-gateway-deployment.yaml
    set:
      gateway.hub.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GATEWAY_HUB_ENABLED
            value: "false"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GATEWAY_HUB_URL
          any: true
  - it: should default TENANT_NAME to the release fullname and allow an override
    template: templates/lunar-ai-gateway-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TENANT_NAME
            value: "RELEASE-NAME-lunar-mcpx-webapp"

  - it: should take TENANT_NAME from values when set
    template: templates/lunar-ai-gateway-deployment.yaml
    set:
      gateway.tenantName: acme
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TENANT_NAME
            value: "acme"

  - it: should set every config path the engine reads from its own env var
    template: templates/lunar-ai-gateway-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LUNAR_PROXY_CONFIG_DIR
            value: "/etc/lunar-proxy"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LUNAR_PROXY_PROCESSORS_DIRECTORY
            value: "/etc/lunar-proxy/processors"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LUNAR_PROXY_METRICS_CONFIG
            value: "/etc/lunar-proxy/metrics.yaml"

  # The flow and the budgets arrive over the hub socket and are held in memory, so a
  # volume here would only be somewhere for a stale copy to sit.
  - it: should mount nothing and seed nothing
    template: templates/lunar-ai-gateway-deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.initContainers
      - notExists:
          path: spec.template.spec.volumes
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts

  # Every config path points into the image. A flows, quotas, providers or backup path
  # would each need somewhere writable.
  - it: should read its config only from read-only paths in the image
    template: templates/lunar-ai-gateway-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DISCOVERY_STATE_LOCATION
            value: "/etc/lunar-proxy/discovery-state.json"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LUNAR_PROXY_FLOW_DIRECTORY
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LUNAR_PROXY_QUOTAS_DIRECTORY
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LUNAR_PROVIDERS_FILE
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LUNAR_PROXY_CONFIG_BACKUP_DIR
          any: true

  # The destination comes from the request, never from the chart.
  - it: should never set LUNAR_DEFAULT_UPSTREAM
    template: templates/lunar-ai-gateway-deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LUNAR_DEFAULT_UPSTREAM
          any: true

  - it: should allow an upstream through extraEnvVars
    template: templates/lunar-ai-gateway-deployment.yaml
    set:
      gateway.extraEnvVars:
        - name: LUNAR_DEFAULT_UPSTREAM
          value: https://api.anthropic.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LUNAR_DEFAULT_UPSTREAM
            value: "https://api.anthropic.com"

  - it: should read REDIS_URL from the same embedded secret as every other service
    template: templates/lunar-ai-gateway-deployment.yaml
    set:
      redis.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: RELEASE-NAME-lunar-mcpx-webapp-embedded
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
          any: true

  # A container's own `env` overrides `envFrom`, so setting it here would shadow
  # the Secret's value.
  - it: should leave REDIS_USE_CLUSTER to the embedded secret rather than shadowing it
    template: templates/lunar-ai-gateway-deployment.yaml
    set:
      redis.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_USE_CLUSTER
          any: true

  # An operator-supplied Secret carries REDIS_IS_CLUSTER, the Node spelling.
  - it: should translate the cluster flag when redis comes from outside the chart
    template: templates/lunar-ai-gateway-deployment.yaml
    set:
      redis.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_USE_CLUSTER
            value: "$(REDIS_IS_CLUSTER)"

  - it: should always set the retry knobs, since a missing one panics the client
    template: templates/lunar-ai-gateway-deployment.yaml
    set:
      redis.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_MAX_RETRY_ATTEMPTS
            value: "10"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_MAX_OPTIMISTIC_LOCKING_RETRY_ATTEMPTS
            value: "50"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_RETRY_BACKOFF_MILLIS
            value: "50"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PREFIX
            value: "lunar-llm-gateway"

  - it: should omit REDIS_PREFIX when the prefix is cleared
    template: templates/lunar-ai-gateway-deployment.yaml
    set:
      gateway.redis.prefix: ""
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PREFIX
          any: true

  - it: should probe the admin server, not the proxy port
    template: templates/lunar-ai-gateway-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: admin

  - it: should expose the proxy on port 80 and metrics separately
    template: templates/lunar-ai-gateway-service.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-lunar-mcpx-webapp-gateway
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.ports[0].targetPort
          value: http
      - equal:
          path: spec.ports[1].name
          value: metrics
      - equal:
          path: spec.ports[1].port
          value: 3000

  - it: should give gce a long backend timeout so streamed completions are not cut
    template: templates/lunar-ai-gateway-service.yaml
    set:
      ingress.type: gce
    documentIndex: 1
    asserts:
      - isKind:
          of: BackendConfig
      - equal:
          path: spec.timeoutSec
          value: 3600
      - equal:
          path: spec.healthCheck.requestPath
          value: /health
      - equal:
          path: spec.healthCheck.port
          value: 12346

  - it: should use the dev registry when global.webappRepository is dev
    template: templates/lunar-ai-gateway-deployment.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^us-central1-docker.pkg.dev/prj-common-442813/lunar-playground/mcpx-ai-gateway:"
    set:
      global.webappRepository: dev
