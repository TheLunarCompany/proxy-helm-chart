suite: AI gateway deployment and service
templates:
  - templates/lunar-ai-gateway-deployment.yaml
  - templates/lunar-ai-gateway-service.yaml

set:
  gateway.enabled: true
  gatewayHub.sharedSecret: s

tests:
  - it: should render nothing when disabled
    set:
      gateway.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should point at the in-cluster gateway-hub Service by default
    template: templates/lunar-ai-gateway-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GATEWAY_HUB_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GATEWAY_HUB_URL
            value: "ws://RELEASE-NAME-lunar-mcpx-webapp-gateway-hub/v1/gateway"

  - it: should let gateway.hub.url override the hub DNS
    template: templates/lunar-ai-gateway-deployment.yaml
    set:
      gateway.hub.url: "wss://gateway-hub.example.com/v1/gateway"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GATEWAY_HUB_URL
            value: "wss://gateway-hub.example.com/v1/gateway"

  - it: should share the hub secret with gateway-hub
    template: templates/lunar-ai-gateway-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GATEWAY_HUB_SHARED_SECRET
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-lunar-mcpx-webapp-gateway-hub
                key: GATEWAY_HUB_SHARED_SECRET

  - it: should send no hub env beyond the off switch when the hub connection is disabled
    template: templates/lunar-ai-gateway-deployment.yaml
    set:
      gateway.hub.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GATEWAY_HUB_ENABLED
            value: "false"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GATEWAY_HUB_URL
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GATEWAY_HUB_SHARED_SECRET
          any: true

  - it: should default TENANT_NAME to the release fullname and allow an override
    template: templates/lunar-ai-gateway-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TENANT_NAME
            value: "RELEASE-NAME-lunar-mcpx-webapp"

  - it: should take TENANT_NAME from values when set
    template: templates/lunar-ai-gateway-deployment.yaml
    set:
      gateway.tenantName: acme
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TENANT_NAME
            value: "acme"

  - it: should set every config path the engine reads from its own env var
    template: templates/lunar-ai-gateway-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LUNAR_PROXY_CONFIG_DIR
            value: "/etc/lunar-proxy"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LUNAR_PROXY_FLOW_DIRECTORY
            value: "/etc/lunar-proxy/flows"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LUNAR_PROXY_PROCESSORS_DIRECTORY
            value: "/etc/lunar-proxy/processors"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LUNAR_PROVIDERS_FILE
            value: "/etc/lunar-proxy/providers.yaml"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LUNAR_PROXY_METRICS_CONFIG
            value: "/etc/lunar-proxy/metrics.yaml"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DISCOVERY_STATE_LOCATION
            value: "/var/log/lunar-proxy/discovery-state.json"

  - it: should mount a writable config directory seeded from the image
    template: templates/lunar-ai-gateway-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: mcpx-gateway-config-seed
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gateway-config
            mountPath: /etc/lunar-proxy
      - contains:
          path: spec.template.spec.volumes
          content:
            name: gateway-config
            emptyDir: {}

  - it: should omit LUNAR_DEFAULT_UPSTREAM unless configured
    template: templates/lunar-ai-gateway-deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LUNAR_DEFAULT_UPSTREAM
          any: true

  - it: should set LUNAR_DEFAULT_UPSTREAM when configured
    template: templates/lunar-ai-gateway-deployment.yaml
    set:
      gateway.defaultUpstream: https://api.anthropic.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LUNAR_DEFAULT_UPSTREAM
            value: "https://api.anthropic.com"

  - it: should probe the admin server, not the proxy port
    template: templates/lunar-ai-gateway-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: admin

  - it: should expose the proxy on port 80 and metrics separately
    template: templates/lunar-ai-gateway-service.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-lunar-mcpx-webapp-gateway
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.ports[0].targetPort
          value: http
      - equal:
          path: spec.ports[1].name
          value: metrics
      - equal:
          path: spec.ports[1].port
          value: 3000

  - it: should give gce a long backend timeout so streamed completions are not cut
    template: templates/lunar-ai-gateway-service.yaml
    set:
      ingress.type: gce
    documentIndex: 1
    asserts:
      - isKind:
          of: BackendConfig
      - equal:
          path: spec.timeoutSec
          value: 3600
      - equal:
          path: spec.healthCheck.requestPath
          value: /health
      - equal:
          path: spec.healthCheck.port
          value: 12346

  - it: should use the dev registry when global.webappRepository is dev
    template: templates/lunar-ai-gateway-deployment.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^us-central1-docker.pkg.dev/prj-common-442813/lunar-playground/mcpx-ai-gateway:"
    set:
      global.webappRepository: dev
