suite: identity broker gets auth-bff's Google credentials
templates:
  - templates/lunar-identity-broker-deployment.yaml
release:
  name: my-release
set:
  postgres.enabled: true
  identityBroker.enabled: true
  identityBroker.products:
    - productId: mcpx
      redirectUris: ["https://auth.example.com/oauth/callback"]
      postLogoutRedirectUris: ["https://auth.example.com/logout/callback"]

tests:
  - it: mounts auth-bff's Google credentials and points GOOGLE_APPLICATION_CREDENTIALS at them
    set:
      auth.googleApplicationCredentials.secretName: google-adc
      auth.googleApplicationCredentials.secretKey: sa.json
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOOGLE_APPLICATION_CREDENTIALS
            value: /var/secrets/google/credentials.json
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: google-application-credentials
            mountPath: /var/secrets/google
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: google-application-credentials
            secret:
              secretName: google-adc
              items:
                - key: sa.json
                  path: credentials.json

  - it: mounts nothing and sets no GOOGLE_APPLICATION_CREDENTIALS without them
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOOGLE_APPLICATION_CREDENTIALS
            value: /var/secrets/google/credentials.json
      - notExists:
          path: spec.template.spec.volumes
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts

  - it: keeps the CA mount next to the Google one
    set:
      global.caCerts.secretName: corp-ca
      auth.googleApplicationCredentials.secretName: google-adc
    asserts:
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 2
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: corp-ca
            mountPath: /usr/local/share/ca-certificates/
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: google-application-credentials
            mountPath: /var/secrets/google
            readOnly: true
