suite: PodDisruptionBudget wiring
templates:
  - templates/pdb.yaml

tests:
  - it: renders no PDB by default
    release:
      name: my-release
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a PDB with maxUnavailable when enabled with enough replicas
    release:
      name: my-release
    set:
      webserver:
        replicaCount: 3
        pdb:
          enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: metadata.name
          value: my-release-lunar-mcpx-webapp-webserver
      - equal:
          path: spec.maxUnavailable
          value: 1
      - equal:
          path: spec.selector.matchLabels.app
          value: my-release-lunar-mcpx-webapp-webserver

  - it: renders one PDB per enabled service
    release:
      name: my-release
    set:
      webserver:
        replicaCount: 3
        pdb:
          enabled: true
      hub:
        replicaCount: 3
        pdb:
          enabled: true
    asserts:
      - hasDocuments:
          count: 2

  - it: minAvailable overrides maxUnavailable
    release:
      name: my-release
    set:
      hub:
        replicaCount: 2
        pdb:
          enabled: true
          minAvailable: 50%
    asserts:
      - equal:
          path: spec.minAvailable
          value: 50%
      - isNull:
          path: spec.maxUnavailable

  - it: fails when enabled with a single replica
    release:
      name: my-release
    set:
      webserver:
        pdb:
          enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "webserver.pdb.enabled requires webserver.replicaCount >= 2 (a PDB on a single replica blocks node drains)"

  - it: renders nothing for a disabled service
    release:
      name: my-release
    set:
      router:
        enabled: false
        replicaCount: 3
        pdb:
          enabled: true
    asserts:
      - hasDocuments:
          count: 0
