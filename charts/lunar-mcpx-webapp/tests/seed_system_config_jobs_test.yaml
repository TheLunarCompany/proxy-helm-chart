suite: Seed System Config Jobs
templates:
  - templates/lunar-admin-seed-system-config-dry-cronjob.yaml
  - templates/lunar-admin-seed-system-config-execute-cronjob.yaml

tests:
  - it: both jobs should be suspended CronJobs on the impossible Feb 31 schedule
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: spec.suspend
          value: true
      - equal:
          path: spec.schedule
          value: "0 0 31 2 *"

  - it: both jobs should run the seed-system-config command
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command
          value: ["node", "dist/index.js", "seed-system-config"]

  - it: dry job should set DRY_RUN=true
    template: templates/lunar-admin-seed-system-config-dry-cronjob.yaml
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: DRY_RUN
            value: "true"

  - it: execute job should set DRY_RUN=false
    template: templates/lunar-admin-seed-system-config-execute-cronjob.yaml
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: DRY_RUN
            value: "false"

  - it: seedSystemConfig map entries should become env vars, stringified
    set:
      jobs.admin.seedSystemConfig:
        HIVE_DEFAULT_LOG_LEVEL: debug
        HIBERNATION_ENABLED: false
        AUDIT_LOG_RETENTION_DAYS: 0
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: HIVE_DEFAULT_LOG_LEVEL
            value: "debug"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: HIBERNATION_ENABLED
            value: "false"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: AUDIT_LOG_RETENTION_DAYS
            value: "0"

  - it: secret-backed keys should reach the job via jobs.extraEnvFromSecrets and jobs.extraEnvVars
    set:
      jobs.extraEnvFromSecrets:
        - my-llm-secret
      jobs.extraEnvVars:
        - name: LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: my-llm-secret
              key: LLM_API_KEY
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: my-llm-secret
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: LLM_API_KEY
            valueFrom:
              secretKeyRef:
                name: my-llm-secret
                key: LLM_API_KEY

  - it: empty seedSystemConfig should yield only DRY_RUN in env
    template: templates/lunar-admin-seed-system-config-dry-cronjob.yaml
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          value:
            - name: DRY_RUN
              value: "true"
