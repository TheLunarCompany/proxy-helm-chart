suite: gateway-hub deployment and service
templates:
  - templates/lunar-gateway-hub-deployment.yaml
  - templates/lunar-gateway-hub-service.yaml

tests:
  - it: should render nothing when both gateway-hub and gateway are disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should serve HTTP and the WebSocket on one port
    template: templates/lunar-gateway-hub-service.yaml
    set:
      gatewayHub.enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-lunar-mcpx-webapp-gateway-hub
      - lengthEqual:
          path: spec.ports
          count: 1
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.ports[0].targetPort
          value: 8080

  - it: should have no init containers when clickhouse is disabled
    template: templates/lunar-gateway-hub-deployment.yaml
    set:
      gatewayHub.enabled: true
    asserts:
      - isNull:
          path: spec.template.spec.initContainers

  - it: should run the clickhouse migration and read the credentials secret when clickhouse is enabled
    template: templates/lunar-gateway-hub-deployment.yaml
    set:
      gatewayHub.enabled: true
      clickhouse.enabled: true
      clickhouse.credentialsSecret: ch-creds
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 1
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: mcpx-gateway-hub-clickhouse-migration
      - matchRegex:
          path: spec.template.spec.initContainers[0].args[1]
          pattern: "node packages/toolkit-clickhouse/dist/bin/migrate.js"
      - contains:
          path: spec.template.spec.initContainers[0].envFrom
          content:
            secretRef:
              name: ch-creds
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: ch-creds
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_URL
            value: "http://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@RELEASE-NAME-lunar-mcpx-webapp-clickhouse:8123"

  - it: should not reference clickhouse at all when it is disabled
    template: templates/lunar-gateway-hub-deployment.yaml
    set:
      gatewayHub.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_URL
          any: true

  - it: should probe readiness on /readyz and liveness on /livez
    template: templates/lunar-gateway-hub-deployment.yaml
    set:
      gatewayHub.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /livez
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /healthcheck

  - it: should pass the clickhouse buffer knobs only when set
    template: templates/lunar-gateway-hub-deployment.yaml
    set:
      gatewayHub.enabled: true
      gatewayHub.clickhouseBuffer.flushIntervalMs: 1000
      gatewayHub.clickhouseBuffer.maxSize: 500
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_BUFFER_FLUSH_INTERVAL_MS
            value: "1000"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_BUFFER_MAX_SIZE
            value: "500"

  - it: should use the dev registry when global.webappRepository is dev
    template: templates/lunar-gateway-hub-deployment.yaml
    set:
      gatewayHub.enabled: true
      global.webappRepository: dev
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^us-central1-docker.pkg.dev/prj-common-442813/lunar-playground/mcpx-gateway-hub:"
