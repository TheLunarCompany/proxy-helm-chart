suite: ClickHouse hourly rollup rebuild job
templates:
  - templates/lunar-admin-rebuild-ch-rollup-cronjob.yaml

tests:
  - it: should not render when ClickHouse is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should be a suspended CronJob
    set:
      clickhouse.enabled: true
      clickhouse.credentialsSecret: ch-creds
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: spec.suspend
          value: true

  - it: should run the rebuild-clickhouse-hourly-rollup command
    set:
      clickhouse.enabled: true
      clickhouse.credentialsSecret: ch-creds
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command
          value: ["node", "dist/index.js", "rebuild-clickhouse-hourly-rollup"]

  - it: should get the ClickHouse URL and credentials
    set:
      clickhouse.enabled: true
      clickhouse.credentialsSecret: ch-creds
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          any: true
          content:
            name: CLICKHOUSE_URL
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: ch-creds
