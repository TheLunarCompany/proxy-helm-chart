suite: serviceAccount wiring
templates:
  - templates/serviceaccount.yaml
  - templates/lunar-webserver-deployment.yaml
  - templates/lunar-hub-deployment.yaml
  - templates/lunar-auth-bff-deployment.yaml
  - templates/lunar-admin-ui-deployment.yaml
  - templates/lunar-hive-ui-deployment.yaml
  - templates/lunar-hive-controller-deployment.yaml
  - templates/lunar-jobs-cronjob.yaml
  - templates/lunar-admin-migrate-status-cronjob.yaml

tests:
  - it: renders no ServiceAccount and no serviceAccountName by default
    release:
      name: my-release
    template: templates/serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: webserver pod has no serviceAccountName by default
    release:
      name: my-release
    template: templates/lunar-webserver-deployment.yaml
    asserts:
      - isNull:
          path: spec.template.spec.serviceAccountName

  - it: creates a ServiceAccount with annotations when enabled
    release:
      name: my-release
    template: templates/serviceaccount.yaml
    set:
      serviceAccount:
        create: true
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/my-role
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: my-release-lunar-mcpx-webapp
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/my-role

  - it: uses the explicit name for the created ServiceAccount
    release:
      name: my-release
    template: templates/serviceaccount.yaml
    set:
      serviceAccount:
        create: true
        name: custom-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa

  - it: sets serviceAccountName on app deployments when created
    release:
      name: my-release
    templates:
      - templates/lunar-webserver-deployment.yaml
      - templates/lunar-hub-deployment.yaml
      - templates/lunar-auth-bff-deployment.yaml
      - templates/lunar-admin-ui-deployment.yaml
      - templates/lunar-hive-ui-deployment.yaml
    set:
      serviceAccount:
        create: true
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: my-release-lunar-mcpx-webapp

  - it: sets serviceAccountName on cronjob pods when created
    release:
      name: my-release
    templates:
      - templates/lunar-jobs-cronjob.yaml
      - templates/lunar-admin-migrate-status-cronjob.yaml
    set:
      serviceAccount:
        create: true
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: my-release-lunar-mcpx-webapp

  - it: references an existing SA by name without creating one
    release:
      name: my-release
    set:
      serviceAccount:
        name: existing-irsa-sa
    asserts:
      - hasDocuments:
          count: 0
        template: templates/serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-irsa-sa
        template: templates/lunar-webserver-deployment.yaml

  - it: hive-controller keeps its own RBAC-bound service account
    release:
      name: my-release
    template: templates/lunar-hive-controller-deployment.yaml
    set:
      serviceAccount:
        create: true
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: my-release-lunar-mcpx-webapp-controller
