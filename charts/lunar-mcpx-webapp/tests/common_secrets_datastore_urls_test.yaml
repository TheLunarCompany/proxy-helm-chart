suite: Common secret datastore URLs
# DATABASE_URL / REDIS_URL embed the embedded Postgres / Redis Service names. They must be derived
# the same length-safe way as the Services themselves, or long release names produce URLs that
# point at a host that does not exist.
templates:
  - templates/lunar-common-secrets.yaml
  - templates/postgresql-service.yaml
  - templates/redis-service.yaml

tests:
  - it: builds datastore URLs from the plain Service names for a short release
    release:
      name: my-release
    set:
      postgres.enabled: true
      redis.enabled: true
    template: templates/lunar-common-secrets.yaml
    asserts:
      - equal:
          path: data.DATABASE_URL
          decodeBase64: true
          value: postgres://postgres:postgres@my-release-lunar-mcpx-webapp-postgres:5432/mcpx?schema=public
      - equal:
          path: data.REDIS_URL
          decodeBase64: true
          value: redis://my-release-lunar-mcpx-webapp-redis:6379

  - it: uses the truncated Service names in datastore URLs for a long release
    release:
      name: ttttttttttttttttttttttttttttttttttttttttttttt
    set:
      postgres.enabled: true
      redis.enabled: true
    template: templates/lunar-common-secrets.yaml
    asserts:
      - equal:
          path: data.DATABASE_URL
          decodeBase64: true
          value: postgres://postgres:postgres@ttttttttttttttttttttttttttttttttttttttttttttt-lunar-mc-postgres:5432/mcpx?schema=public
      - equal:
          path: data.REDIS_URL
          decodeBase64: true
          value: redis://ttttttttttttttttttttttttttttttttttttttttttttt-lunar-mcpx-redis:6379

  - it: renders Postgres and Redis Services under exactly those truncated names
    release:
      name: ttttttttttttttttttttttttttttttttttttttttttttt
    set:
      postgres.enabled: true
      redis.enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: ttttttttttttttttttttttttttttttttttttttttttttt-lunar-mc-postgres
        template: templates/postgresql-service.yaml
      - equal:
          path: metadata.name
          value: ttttttttttttttttttttttttttttttttttttttttttttt-lunar-mcpx-redis
        template: templates/redis-service.yaml
