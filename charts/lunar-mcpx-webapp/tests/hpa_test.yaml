suite: HorizontalPodAutoscaler wiring
templates:
  - templates/hpa.yaml

tests:
  - it: renders no HPA by default
    release:
      name: my-release
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an HPA with only the cpu metric by default when enabled per service
    release:
      name: my-release
    set:
      router:
        hpa:
          enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HorizontalPodAutoscaler
      - equal:
          path: metadata.name
          value: my-release-lunar-mcpx-webapp-router
      - equal:
          path: spec.scaleTargetRef.name
          value: my-release-lunar-mcpx-webapp-router
      - equal:
          path: spec.minReplicas
          value: 2
      - equal:
          path: spec.maxReplicas
          value: 8
      - lengthEqual:
          path: spec.metrics
          count: 1
      - equal:
          path: spec.metrics[0].resource.name
          value: cpu
      - equal:
          path: spec.metrics[0].resource.target.averageUtilization
          value: 70
      - equal:
          path: spec.behavior.scaleDown.stabilizationWindowSeconds
          value: 300

  - it: setting targetMemoryUtilizationPercentage adds the memory metric
    release:
      name: my-release
    set:
      router:
        hpa:
          enabled: true
          targetMemoryUtilizationPercentage: 80
    asserts:
      - lengthEqual:
          path: spec.metrics
          count: 2
      - equal:
          path: spec.metrics[1].resource.name
          value: memory
      - equal:
          path: spec.metrics[1].resource.target.averageUtilization
          value: 80

  - it: scaleDownStabilizationSeconds 0 means immediate, not "unset"
    release:
      name: my-release
    set:
      router:
        hpa:
          enabled: true
          scaleDownStabilizationSeconds: 0
    asserts:
      - equal:
          path: spec.behavior.scaleDown.stabilizationWindowSeconds
          value: 0

  - it: global hpa enables all app deployments
    release:
      name: my-release
    set:
      global:
        hpa:
          enabled: true
    asserts:
      - hasDocuments:
          count: 7
      - documentIndex: 6
        equal:
          path: metadata.name
          value: my-release-lunar-mcpx-webapp-controller

  - it: service-level enabled false overrides global
    release:
      name: my-release
    set:
      global:
        hpa:
          enabled: true
      admin:
        hpa:
          enabled: false
    asserts:
      - hasDocuments:
          count: 6

  - it: service-level minReplicas overrides global
    release:
      name: my-release
    set:
      global:
        hpa:
          minReplicas: 3
      router:
        hpa:
          enabled: true
          minReplicas: 5
    asserts:
      - equal:
          path: spec.minReplicas
          value: 5

  - it: empty targetMemoryUtilizationPercentage opts out of the memory metric
    release:
      name: my-release
    set:
      router:
        hpa:
          enabled: true
          targetMemoryUtilizationPercentage: ""
    asserts:
      - lengthEqual:
          path: spec.metrics
          count: 1
      - equal:
          path: spec.metrics[0].resource.name
          value: cpu

  - it: fails when maxReplicas is less than minReplicas
    release:
      name: my-release
    set:
      router:
        hpa:
          enabled: true
          minReplicas: 5
          maxReplicas: 3
    asserts:
      - failedTemplate:
          errorMessage: "hpa is enabled for router but router.hpa.maxReplicas (3) is less than minReplicas (5)"

  - it: fails when neither cpu nor memory targets are set
    release:
      name: my-release
    set:
      router:
        hpa:
          enabled: true
          targetCPUUtilizationPercentage: ""
          targetMemoryUtilizationPercentage: ""
    asserts:
      - failedTemplate:
          errorMessage: "hpa is enabled for router but neither router.hpa.targetCPUUtilizationPercentage nor targetMemoryUtilizationPercentage is set; an HPA needs at least one metric"

  - it: renders nothing for a disabled service
    release:
      name: my-release
    set:
      router:
        enabled: false
        hpa:
          enabled: true
    asserts:
      - hasDocuments:
          count: 0
