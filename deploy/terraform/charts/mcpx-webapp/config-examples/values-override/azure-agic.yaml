---
global:
  extraEnvVars:
    - name: LOG_LEVEL
      value: debug
  extraEnvFromSecrets:
    - mcpx-webapp-global

webserver:
  replicaCount: 1

hub:
  replicaCount: 1
  extraEnvFromSecrets:
    - mcpx-webapp-oidc

admin:
  replicaCount: 1

auth:
  replicaCount: 1
  extraEnvFromSecrets:
    - mcpx-webapp-oidc

controller:
  replicaCount: 1

router:
  replicaCount: 1
  extraEnvFromSecrets:
    - mcpx-webapp-oidc

ui:
  replicaCount: 1

ingress:
  annotations:
    kubernetes.io/tls-acme: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-agic"
  type: agic

  domains:
    webserver:
      - mcpx-app.example.com
    admin:
      - mcpx-admin.example.com
    auth:
      - mcpx-auth.example.com
    ui:
      - mcpx-ui.example.com
    router:
      - mcpx.example.com

postgres:
  enabled: true

redis:
  enabled: true
